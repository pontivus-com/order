name: PR Verification

on:
  pull_request:
    branches: [master, fix/0.6.0-post-squash-campaign-fitness, docs/0.6.0-workbench-implementation-contract]
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
      PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT: /tmp/pontivus-order-opencode-drive
      PONTIVUS_ORDER_REQUIRE_OPENCODE_DRIVE: "1"
    steps:
      - name: Checkout exact PR merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}" \
            "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/pr-merge"
          # Stacked PR bases are not master; the existing campaign sensor
          # also needs the actual shared default-branch history for its
          # historical squash-integration proof. This ref is evidence only.
          if [[ "${{ github.event.pull_request.base.ref }}" != "master" ]]; then
            git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          fi
          git checkout --detach refs/remotes/origin/pr-merge
          test "$(git rev-parse HEAD^1)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" \
            "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.4"

      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"

      - name: Install exact OpenCode Drive verification tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          mkdir -p "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          cd "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          printf '{"private":true,"type":"module"}\n' > package.json
          bun add --exact opencode-drive@2.4.1 effect@4.0.1
          test "$(node -p "require('${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}/node_modules/opencode-drive/package.json').version")" = "2.4.1"
          test "$(node -p "require('${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}/node_modules/effect/package.json').version")" = "4.0.1"

      - name: Verify PR release metadata
        run: bun scripts/verify-release.ts --mode pr --base "refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: dependency-lock
        run: bun ci

      - name: typecheck
        run: bun run tsc --noEmit

      - name: architecture
        run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts

      - name: test
        run: node node_modules/vitest/vitest.mjs run

      - name: build
        run: node node_modules/vite/bin/vite.js build

      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Record signed rendered phase candidate
        id: signed_candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: signed rendered IA27_28
        id: signed_ia27_28
        if: ${{ !cancelled() && steps.signed_candidate.outcome == 'success' }}
        continue-on-error: true
        env:
          PONTIVUS_ORDER_RENDERED_ACCEPTANCE_DIR: ${{ runner.temp }}/order-rendered-signed-ia27_28
          PONTIVUS_ORDER_RENDERED_ACCEPTANCE_CANDIDATE_SHA: ${{ steps.signed_candidate.outputs.sha }}
          PONTIVUS_ORDER_RENDERED_ACCEPTANCE_LABEL: "IA27_28 signed phase evidence"
          PONTIVUS_ORDER_RENDERED_EVIDENCE_KIND: "ia26_acceptance"
          PONTIVUS_ORDER_SIGNED_RENDERED_PHASE: "IA27_28"
        shell: bash
        run: |
          set +e
          mkdir -p "$PONTIVUS_ORDER_RENDERED_ACCEPTANCE_DIR"
          node node_modules/@playwright/test/cli.js test --grep "rendered acceptance phase 1"
          status=$?
          printf '{"candidateSha":"%s","signedPhase":"%s","exitStatus":%s}\n' "$PONTIVUS_ORDER_RENDERED_ACCEPTANCE_CANDIDATE_SHA" "$PONTIVUS_ORDER_SIGNED_RENDERED_PHASE" "$status" > "$PONTIVUS_ORDER_RENDERED_ACCEPTANCE_DIR/exit-status.json"
          if [[ "$status" == 0 && ! -s "$PONTIVUS_ORDER_RENDERED_ACCEPTANCE_DIR/manifest.json" ]]; then exit 1; fi
          exit "$status"

      - name: Upload signed rendered IA27_28
        id: upload_ia27_28
        if: ${{ !cancelled() && steps.signed_candidate.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-signed-ia27_28-${{ steps.signed_candidate.outputs.sha }}
          path: ${{ runner.temp }}/order-rendered-signed-ia27_28
          if-no-files-found: error
          retention-days: 14

      - name: signed rendered IA29
