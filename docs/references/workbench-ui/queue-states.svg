<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Queue states</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Operational scan states</text><rect x="28" y="140" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="50" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Active list populated</text><text x="50" y="214" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Rows show title/project, kind, lifecycle/status, concerns and actions. Selecting an active row opens the WorkItem.</text><rect x="28" y="300" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="50" y="338" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Show archived</text><text x="50" y="374" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Archived items join the scan with an Archived marker; archived rows are not selectable as active work and expose Restore.</text><rect x="28" y="460" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="50" y="498" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Search / project context</text><text x="50" y="534" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Search filters title/project/stage/status/concerns; optional project context narrows queue/creation without changing WorkItem authority.</text><rect x="28" y="620" width="1384" height="140" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="50" y="658" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Empty / no matches</text><text x="50" y="694" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Explain whether there are no WorkItems or only no search matches. Configuration blockers are not hidden behind an unexplained empty queue.</text></svg>