name: temporary workbench refactor verification
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-workbench-refactor-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Simulate final tree
        run: rm -f .github/workflows/temp-workbench-refactor-verify.yml
      - name: Install exact pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.4.4
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Dependency lock
        run: bun ci
      - name: Typecheck
        run: bun run tsc --noEmit
      - name: Architecture
        run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts
      - name: Certification
        run: node node_modules/vitest/vitest.mjs run tests/certification.test.ts
      - name: Full tests
        run: node node_modules/vitest/vitest.mjs run
      - name: Production build
        run: node node_modules/vite/bin/vite.js build
      - name: Browser
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js install chromium
          fake="$RUNNER_TEMP/fake-opencode.ts"
          cat > "$fake" <<'EOF'
          #!/usr/bin/env bun
          const args = process.argv.slice(2);
          if (args.length === 1 && args[0] === "--version") {
            console.log("opencode v2.2.6");
            process.exit(0);
          }
          if (
            args.length !== 5 ||
            args[0] !== "serve" ||
            args[1] !== "--hostname" ||
            args[2] !== "127.0.0.1" ||
            args[3] !== "--port" ||
            args[4] !== "0"
          ) {
            console.error("unexpected argv", JSON.stringify(args));
            process.exit(2);
          }
          const json = (value, status = 200) =>
            new Response(JSON.stringify(value), {
              status,
              headers: { "content-type": "application/json" },
            });
          const server = Bun.serve({
            hostname: "127.0.0.1",
            port: 0,
            fetch(request) {
              if (!request.headers.get("authorization")?.startsWith("Basic ")) {
                return json({ message: "unauthorized" }, 401);
              }
              const url = new URL(request.url);
              if (request.method === "GET" && url.pathname === "/api/info") {
                return json({ version: "2.2.6" });
              }
              if (request.method === "GET" && url.pathname === "/api/model") {
                return json({
                  location: { directory: process.cwd() },
                  data: [{ providerID: "openai", id: "gpt-5.6", enabled: true }],
                });
              }
              return json({ message: "not found" }, 404);
            },
          });
          console.log("server listening on http://127.0.0.1:" + server.port);
          await new Promise(() => {});
          EOF
          chmod 755 "$fake"
          state="$RUNNER_TEMP/order-browser-state"
          rm -rf "$state" "$state-e2e-project" "$state-work-items"
          mkdir -p "$state"
          PONTIVUS_ORDER_TEST_STATE_ROOT="$state" \
          PONTIVUS_ORDER_OPENCODE_BIN="$fake" \
          PONTIVUS_ORDER_BIND="127.0.0.1:17347" \
          node node_modules/@playwright/test/cli.js test

