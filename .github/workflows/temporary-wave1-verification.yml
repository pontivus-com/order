name: Temporary Wave 1 consolidated verification

on:
  pull_request:
    types: [opened]
    branches: [fix/0.6.0-ia25-verification]
permissions:
  contents: read

jobs:
  wave1:
    if: github.event.pull_request.head.ref == 'fix/0.6.0-wave1-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
      PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT: /tmp/pontivus-order-opencode-drive
      PONTIVUS_ORDER_REQUIRE_OPENCODE_DRIVE: "1"
    steps:
      - name: Checkout exact detached Wave 1 proposal
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/fix/0.6.0-wave1-lifecycle:refs/remotes/origin/wave1" "+refs/heads/fix/0.6.0-ia25-verification:refs/remotes/origin/consolidation"
          test "$(git rev-parse refs/remotes/origin/consolidation)" = "78568e8bfa374edcc02eb4a4bdfbbbb05ac010ab"
          git checkout --detach "c6a9c23e627817b42ef821643bf8cf513b5ed938"
          test "$(git rev-parse HEAD)" = "c6a9c23e627817b42ef821643bf8cf513b5ed938"
          git merge-base --is-ancestor "78568e8bfa374edcc02eb4a4bdfbbbb05ac010ab" HEAD
          test -z "$(git status --porcelain)"
      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" \
            "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.4"

      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"

      - name: Install exact OpenCode Drive verification tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          mkdir -p "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          cd "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          printf '{"private":true,"type":"module"}\n' > package.json
          bun add --exact opencode-drive@2.4.1 effect@4.0.1
          test "$(node -p "require('${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}/node_modules/opencode-drive/package.json').version")" = "2.4.1"
          test "$(node -p "require('${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}/node_modules/effect/package.json').version")" = "4.0.1"

      - name: dependency-lock
        run: bun ci

      - name: typecheck
        run: bun run tsc --noEmit

      - name: Consolidated behavioral verification
        run: node node_modules/vitest/vitest.mjs run tests/certification.test.ts tests/core.test.ts tests/daemon.test.ts tests/installer.test.ts tests/markdown-source-formatting.test.ts tests/opencode.test.ts tests/order-migration.test.ts tests/process.test.ts tests/shell.test.ts tests/sqlite.test.ts tests/workbench-presentation.test.ts

      - name: build
        run: node node_modules/vite/bin/vite.js build

      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Wave 1 browser regressions
        run: node node_modules/@playwright/test/cli.js test --grep 'Approval consumes the real typed stale authority|valid external Work request drift|queue opens a primary workspace|queue filtering composes archive dataset|repository-native WorkItem management|proposal decisions are primary|terminal investigation and audit results|all non-delivery terminal classifications|invalid lifecycle Markdown stays inspection-only|active agent ownership keeps title'
