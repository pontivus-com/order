name: Temporary C6 notice-state evidence capture
# Evidence generation only: a green run is not a C6 conformance verdict.

on:
  push:
    branches:
      - fix/0.5.0-structural-ui-recovery

permissions:
  contents: read

concurrency:
  group: tmp-c6-notices-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-c6-notice-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"
          curl -fsSLo "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"
      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Generate notice-state capture spec
        shell: bash
        run: |
          cat > tests/c6-notices.temp.spec.ts <<'SPEC'
          import { mkdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Page } from "@playwright/test";

          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();
          const out = "c6-notices-evidence/actual/application-notices-states";
          const shot = async (page: Page, state: string) => {
            mkdirSync(out, { recursive: true });
            await page.screenshot({ path: join(out, state + ".png"), fullPage: false });
          };
          const mint = async (request: APIRequestContext) => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            return String((await response.json() as { token: string }).token);
          };
          const auth = async (page: Page, request: APIRequestContext) => {
            await page.goto("/connect?token=" + await mint(request));
            await expect(page.getByTestId("work-item-queue")).toBeVisible();
          };

          test("loading, local-session, error and empty shared states", async ({ page, request }) => {
            await page.route("**/api/settings/readiness", async (route) => {
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ ready: true, blockers: [] }) });
            });
            await page.route("**/api/work-item-sources/diagnostics", async (route) => {
              await route.fulfill({ status: 200, contentType: "application/json", body: "[]" });
            });
            await page.setViewportSize({ width: 1440, height: 900 });
            await auth(page, request);

            let releaseWorkItems!: () => void;
            const barrier = new Promise<void>((resolve) => { releaseWorkItems = resolve; });
            let delayed = true;
            await page.route("**/api/work-items", async (route) => {
              if (route.request().method() === "GET" && delayed) {
                await barrier;
              }
              await route.continue();
            });
            const loadingNavigation = page.reload();
            await expect(page.getByText("Loading work items…", { exact: true })).toBeVisible();
            await shot(page, "loading");
            delayed = false;
            releaseWorkItems();
            await loadingNavigation;
            await page.unroute("**/api/work-items");
            await expect(page.getByTestId("work-item-queue")).toBeVisible();

            await page.context().clearCookies();
            await page.reload();
            await expect(page.getByText("Local browser session required", { exact: true })).toBeVisible();
            await shot(page, "local-browser-session-required");

            await auth(page, request);
            const items = await page.context().request.get("/api/work-items");
            expect(items.status()).toBe(200);
            const first = (await items.json() as Array<{id:string; title:string}>)[0]!;
            await page.goto("/");
            const row = page.locator('[data-testid^="work-item-row-"]')
              .filter({ has: page.getByText(first.title, { exact: true }) }).first();
            await expect(row).toBeVisible();
            await row.click();
            await expect(page.getByTestId("work-item-heading")).toHaveText(first.title);
            await page.route("**/api/work-items/" + first.id, async (route) => {
              if (route.request().method() === "GET") {
                await route.fulfill({
                  status: 503,
                  contentType: "application/json",
                  body: JSON.stringify({
                    code: "TEMPORARY_UNAVAILABLE",
                    message: "Temporary selected WorkItem failure.",
                    sourceDiagnostic: null,
                    staleAuthorityOwner: null
                  })
                });
                return;
              }
              await route.fallback();
            });
            await page.reload();
            await expect(page.getByText("Selected work item unavailable", { exact: true })).toBeVisible();
            await shot(page, "error");
            await page.unroute("**/api/work-items/" + first.id);

            await page.goto("/");
            await page.route("**/api/work-items", async (route) => {
              if (route.request().method() === "GET") {
                await route.fulfill({ status: 200, contentType: "application/json", body: "[]" });
                return;
              }
              await route.fallback();
            });
            await page.reload();
            await expect(page.getByText("No work items", { exact: true })).toBeVisible();
            await shot(page, "empty");
          });
          SPEC

          cat > playwright.c6-notices.temp.config.ts <<'CONFIG'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "c6-notices.temp.spec.ts",
            workers: 1,
            retries: 0,
            timeout: 90000,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120000
            }
          });
          CONFIG
      - name: Capture remaining C6 shared states
        run: node node_modules/@playwright/test/cli.js test --config=playwright.c6-notices.temp.config.ts
      - name: Verify notice-state inventory
        shell: bash
        run: |
          set -euo pipefail
          for s in loading local-browser-session-required error empty; do
            test -s "c6-notices-evidence/actual/application-notices-states/${s}.png"
          done
      - name: Upload C6 notice-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-notice-state-evidence-${{ github.sha }}
          path: c6-notices-evidence
          if-no-files-found: warn
          retention-days: 7
