,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#16A34A" text-anchor="middle">Source-backed</text><text x="52" y="346" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Requested outcome</text><text x="70" y="370" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Deliver the 0.5.0 Workbench as one coherent operator workflow.</text><text x="70" y="390" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Every lifecycle step is organized around its operator task and completion outcome.</text><text x="52" y="426" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Current context</text><text x="70" y="450" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Derived from the completed parent Audit in the same project.</text><text x="70" y="470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• The underlying state architecture is largely sound; operator interaction is incomplete at named boundaries.</text><text x="52" y="506" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Constraints / non-goals</text><text x="70" y="530" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Preserve canonical lifecycle ownership and FCIS/SoC/strict typing.</text><text x="70" y="550" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Do not expose hidden reasoning or fabricate Run/conformance history.</text><text x="52" y="586" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Evidence / references</text><text x="70" y="610" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Parent application-interaction map, state audit, OpenCode audit, material-maturity audit, certification map.</text><rect x="1036" y="354" width="334" height="150" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="1056" y="384" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Work type</text><text x="1188" y="384" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="start">Change</text><text x="1056" y="414" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Project</text><text x="1188" y="414" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">order</text><text x="1056" y="444" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Concerns</text><text x="1188" y="444" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">core, daemon, foundation,</text><text x="1188" y="462" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">ui, verification</text><rect 