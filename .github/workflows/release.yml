name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      commit:
        description: Exact master commit to retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: order-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/heads/master:refs/remotes/origin/master"
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse refs/remotes/origin/master)" = "${TARGET_SHA}"

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" \
            "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.4"

      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"

      - name: Detect release version change
        id: release-change
        shell: bash
        run: |
          set -euo pipefail
          current="$(bun -e 'process.stdout.write(JSON.parse(await Bun.file("package.json").text()).version)')"
          parent="$(git rev-parse HEAD^)"
          previous="$(git show "${parent}:package.json" | bun -e 'let s=""; const d=new TextDecoder(); for await (const c of Bun.stdin.stream()) s+=d.decode(c,{stream:true}); s+=d.decode(); process.stdout.write(JSON.parse(s).version)')"
          if [[ "${current}" == "${previous}" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "version=${current}" >> "${GITHUB_OUTPUT}"
            echo "parent=${parent}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify release metadata
        if: steps.release-change.outputs.changed == 'true'
        run: bun scripts/verify-release.ts --mode release-commit --base "${{ steps.release-change.outputs.parent }}"

      - name: dependency-lock
        if: steps.release-change.outputs.changed == 'true'
        run: bun ci

      - name: Install Playwright Chromium
        if: steps.release-change.outputs.changed == 'true'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: typecheck
        if: steps.release-change.outputs.changed == 'true'
        run: bun run tsc --noEmit

      - name: architecture
        if: steps.release-change.outputs.changed == 'true'
        run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts

      - name: test
        if: steps.release-change.outputs.changed == 'true'
        run: node node_modules/vitest/vitest.mjs run

      - name: build
        if: steps.release-change.outputs.changed == 'true'
        run: node node_modules/vite/bin/vite.js build

      - name: browser
        if: steps.release-change.outputs.changed == 'true'
        run: node node_modules/@playwright/test/cli.js test

      - name: Build release bundle
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/package-release.ts
          (cd release && sha256sum -c pontivus-order.tar.gz.sha256)
          test -s release/release-notes.md

      - name: Create or verify annotated tag
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-change.outputs.version }}"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n1 "${tag}")" = "${TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${TARGET_SHA}" -m "Order ${version}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create upload and publish GitHub Release
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-change.outputs.version }}"
          tag="v${version}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"

          code="$(curl -sS -o "${RUNNER_TEMP}/existing-release.json" -w '%{http_code}' \
            -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${tag}")"

          if [[ "${code}" == "404" ]]; then
            CREATE_RELEASE_JSON="${RUNNER_TEMP}/create-release.json" RELEASE_TAG="${tag}" RELEASE_SHA="${TARGET_SHA}" \
              bun -e 'const body=await Bun.file("release/release-notes.md").text(); const tag=process.env.RELEASE_TAG; await Bun.write(process.env.CREATE_RELEASE_JSON, JSON.stringify({tag_name:tag,target_commitish:process.env.RELEASE_SHA,name:tag,body,draft:true,prerelease:false}));'
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/vnd.github+json" \
              -d @"${RUNNER_TEMP}/create-release.json" "${api}/releases" > "${RUNNER_TEMP}/release.json"
          elif [[ "${code}" == "200" ]]; then
            cp "${RUNNER_TEMP}/existing-release.json" "${RUNNER_TEMP}/release.json"
          else
            cat "${RUNNER_TEMP}/existing-release.json" >&2
            exit 1
          fi

          release_id="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.id));')"
          is_draft="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.draft));')"
          if [[ "${is_draft}" != "true" ]]; then
            exit 0
          fi

          for asset in pontivus-order.tar.gz pontivus-order.tar.gz.sha256; do
            existing_url="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" ASSET_NAME="${asset}" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); const a=(r.assets??[]).find(x=>x.name===process.env.ASSET_NAME); process.stdout.write(a?.url??"");')"
            if [[ -n "${existing_url}" ]]; then
              existing_asset="${RUNNER_TEMP}/existing-${asset}"
              curl -fsS -L -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Accept: application/octet-stream" "${existing_url}" -o "${existing_asset}"
              cmp -s "release/${asset}" "${existing_asset}"
              continue
            fi
            content_type="application/octet-stream"
            [[ "${asset}" == *.sha256 ]] && content_type="text/plain"
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: ${content_type}" --data-binary @"release/${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" >/dev/null
          done

          curl -fsS -X PATCH -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.github+json" \
            -d '{"draft":false}' "${api}/releases/${release_id}" >/dev/null
