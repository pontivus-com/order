<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Application notices and shared states</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">App-level notices and shared empty/loading/error patterns</text><rect x="28" y="130" width="684" height="180" rx="8" fill="#FFFAEB" stroke="#D9DEE8"/><text x="50" y="164" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#B54708" text-anchor="start">Setup requires attention</text><text x="50" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Complete installation Settings before productive work.</text><rect x="50" y="258" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="148" y="275" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Open owning Settings area</text><rect x="728" y="130" width="684" height="180" rx="8" fill="#FFFAEB" stroke="#D9DEE8"/><text x="750" y="164" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#B54708" text-anchor="start">Source diagnostics require attention</text><text x="750" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">One or more repository WorkItem sources require explicit recovery.</text><rect x="750" y="258" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="848" y="275" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Inspect diagnostics / owning source</text><rect x="28" y="350" width="684" height="180" rx="8" fill="#FEF3F2" stroke="#D9DEE8"/><text x="50" y="384" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#B42318" text-anchor="start">Local browser session required</text><text x="50" y="418" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Reconnect through the daemon-owned local browser bootstrap.</text><rect x="50" y="478" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="148" y="495" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Reconnect</text><rect x="728" y="350" width="684" height="180" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="750" y="384" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#657187" text-anchor="start">Loading</text><text x="750" y="418" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Current query/material is loading; owning layout stays stable.</text><rect x="750" y="478" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="848" y="495" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">No mutation</text><rect x="28" y="570" width="684" height="180" rx="8" fill="#FEF3F2" stroke="#D9DEE8"/><text x="50" y="604" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#B42318" text-anchor="start">Error</text><text x="50" y="638" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Owning material remains visible where possible; show human-readable reason and Retry when valid.</text><rect x="50" y="698" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="148" y="715" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Retry if canonically eligible</text><rect x="728" y="570" width="684" height="180" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="750" y="604" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#657187" text-anchor="start">Empty</text><text x="750" y="638" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Explain the empty condition and the productive next action when one exists.</text><rect x="750" y="698" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="848" y="715" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Contextual action only</text></svg>