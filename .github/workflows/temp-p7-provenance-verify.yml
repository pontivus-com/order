name: temporary P7 provenance verification
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-p7-provenance-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Simulate final tree
        run: rm -f .github/workflows/temp-p7-provenance-verify.yml
      - name: Install exact pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.4.4
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun ci
      - run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts
