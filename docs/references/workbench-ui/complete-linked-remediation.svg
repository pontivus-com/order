xt><line x1="48" y1="416" x2="1390" y2="416" stroke="#D9DEE8" stroke-width="1"/><text x="48" y="456" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#0F172A" text-anchor="start">Create linked remediation creates a separate Change or Defect in the same project; it does not reopen or mutate the completed Audit.</text><text x="48" y="486" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#657187" text-anchor="start">Non-eligible terminal outcomes do not show this action.</text></svg>