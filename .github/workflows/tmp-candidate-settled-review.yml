name: Temporary settled candidate visual review
# retry-settled-evidence

on:
  push:
    branches: [version/0.5.0]
    paths-ignore:
      - "candidate-review-settled/**"

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-settled-review-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
      CANDIDATE_SHA: 9c3c67913e41bd29e906e4f2879aca9b88de232a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c3c67913e41bd29e906e4f2879aca9b88de232a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.4"
      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
      - run: bun ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate settled evidence test
        shell: bash
        run: |
          cat > tests/candidate-settled.temp.spec.ts <<'VISUAL'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Page } from "@playwright/test";
          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();

          const mint = async (request: APIRequestContext): Promise<string> => {
            const r = await request.post("/api/auth/connect-token", { headers:{authorization:"Bearer "+daemonToken}, data:{} });
            expect(r.status()).toBe(200);
            return String((await r.json() as {token:string}).token);
          };
          const auth = async (page: Page, request: APIRequestContext) => {
            await page.goto("/connect?token="+await mint(request));
            await expect(page.getByText("Order",{exact:true})).toBeVisible();
          };
          const rowFor=(page:Page,title:string)=>page.locator('[data-testid^="work-item-row-"]').filter({has:page.getByText(title,{exact:true})}).first();
          const open=async(page:Page,title:string)=>{await page.goto("/");const row=rowFor(page,title);await expect(row).toBeVisible();await row.click();await expect(page.getByTestId("work-item-heading")).toHaveText(title);};
          const step=async(page:Page,name:string)=>{const b=page.getByTestId("workflow-rail").getByRole("button",{name,exact:true});await b.click();await expect(b).toHaveAttribute("aria-pressed","true");};
          const disclosure=async(page:Page,name:string)=>{const b=page.getByRole("button",{name,exact:true});if(await b.getAttribute("aria-expanded")!=="true")await b.click();};
          const settle=async(page:Page)=>{
            await page.waitForTimeout(1500);
          };
          const capture=async(page:Page,names:readonly string[])=>{await settle(page);for(const n of names)await page.screenshot({path:"candidate-review-settled/actual/"+n.replace(/\.svg$/,".png"),fullPage:true});};

          test("settled 41-reference evidence",async({page,request})=>{
            test.setTimeout(300000);
            await page.setViewportSize({width:1600,height:900}); await auth(page,request);
            await capture(page,["queue.svg","queue-states.svg","application-notices-states.svg"]);
            await page.getByRole("button",{name:"New work item"}).click(); await expect(page.getByRole("dialog",{name:"Create work item"})).toBeVisible(); await capture(page,["create-work-item.svg"]); await page.goto("/");
            await open(page,"Lifecycle editing workbench"); await capture(page,["workitem-shell-controls.svg","current-attention-states.svg"]);
            await page.getByRole("button",{name:"Context",exact:true}).click(); await capture(page,["workitem-context.svg"]); await page.getByRole("button",{name:"Context",exact:true}).click();
            await step(page,"Work request"); await capture(page,["work-request.svg","document-authoring.svg"]);
            await step(page,"Research"); await capture(page,["research.svg","dialogue-states.svg"]);
            await step(page,"Requirements"); await capture(page,["requirements.svg"]);
            await step(page,"Solution design"); await capture(page,["solution-design.svg"]);
            await step(page,"Implementation plan"); await capture(page,["implementation-plan.svg","document-states.svg","work-type-variants.svg"]);
            await disclosure(page,"Supporting material and history"); const wr=page.getByRole("button",{name:"Open Work request",exact:true}); if(await wr.count())await wr.click(); await capture(page,["document-readonly.svg"]);
            await open(page,"Proposal review"); await expect(page.getByTestId("proposal-review-workspace")).toBeVisible(); await capture(page,["proposal-review.svg","proposal-states.svg"]);
            await open(page,"Invalid lifecycle Markdown"); const inspect=page.getByRole("button",{name:/Inspect exact bytes/}).first(); if(await inspect.count())await inspect.click(); await capture(page,["evidence-viewer.svg"]);
            await open(page,"Awaiting sign-off"); await step(page,"Readiness review"); await capture(page,["readiness-review.svg"]); await step(page,"Approval"); await capture(page,["approval.svg"]); await disclosure(page,"Package material"); const t=page.getByRole("button",{name:/Inspect task:/}).first(); if(await t.count())await t.click(); await capture(page,["approval-task-detail.svg"]);
            await open(page,"Implementation action ready"); await step(page,"Implementation"); await capture(page,["implementation.svg","implementation-states.svg"]);
            await open(page,"Completed investigation"); await step(page,"Complete"); await capture(page,["complete.svg","complete-linked-remediation.svg"]); const rem=page.getByRole("button",{name:"Create linked remediation"});if(await rem.count())await rem.click();await capture(page,["create-linked-remediation.svg"]);await page.goto("/");
            await page.getByRole("link",{name:"Settings",exact:true}).click();await capture(page,["settings-repositories.svg","installation-readiness.svg"]);await page.getByRole("button",{name:"Add repository"}).click();await capture(page,["settings-repository-add.svg"]);await page.getByRole("button",{name:"Cancel add repository"}).click();const move=page.getByRole("button",{name:/Move WorkItem documents/}).first();if(await move.count())await move.click();await capture(page,["settings-repository-move.svg"]);const cm=page.getByRole("button",{name:/Cancel move/}).first();if(await cm.count())await cm.click();
            await page.getByRole("link",{name:"OpenCode",exact:true}).click();await capture(page,["settings-opencode.svg"]);const add=page.getByRole("button",{name:"Add account"});if(await add.count())await add.click();await capture(page,["settings-opencode-add.svg"]);const ca=page.getByRole("button",{name:/Cancel/}).first();if(await ca.count())await ca.click();await capture(page,["settings-opencode-rename.svg","settings-opencode-login.svg","settings-opencode-login-states.svg"]);
            await page.getByRole("link",{name:"Model & runtime",exact:true}).click();await capture(page,["settings-model.svg"]);
            await page.goto("/");await page.setViewportSize({width:700,height:800});await open(page,"Lifecycle editing workbench");await capture(page,["responsive-composition.svg"]);
            await page.setViewportSize({width:1600,height:900});await page.getByRole("radio",{name:"Dark"}).click();await capture(page,["theme-parity.svg"]);await page.getByRole("radio",{name:"System"}).click();
            await page.getByRole("button",{name:"Archive work item"}).click();await expect(page.getByRole("alertdialog",{name:"Archive work item?"})).toBeVisible();await capture(page,["safety-confirmations.svg"]);
          });
          VISUAL
          cat > playwright.settled.temp.config.ts <<'CONFIG'
          import {defineConfig} from "@playwright/test";
          export default defineConfig({testDir:"./tests",testMatch:"candidate-settled.temp.spec.ts",workers:1,retries:0,use:{baseURL:"http://127.0.0.1:17347"},projects:[{name:"chromium",use:{browserName:"chromium"}}],webServer:{command:"bun tests/e2e-server.ts",url:"http://127.0.0.1:17347/api/health",reuseExistingServer:false,timeout:120000}});
          CONFIG
      - run: node node_modules/@playwright/test/cli.js test --config=playwright.settled.temp.config.ts
      - name: Verify 41 actuals
        shell: bash
        run: |
          expected="$(find docs/references/workbench-ui -maxdepth 1 -name '*.svg' ! -name 'order-*' -printf '%f\n'|sort)"
          actual="$(find candidate-review-settled/actual -name '*.png' -printf '%f\n'|sed 's/\.png$/.svg/'|sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
      - name: Rasterize references
        shell: bash
        run: |
          cat > candidate-settled-render.temp.mjs <<'SCRIPT'
          import {chromium} from "@playwright/test";import{readdirSync,mkdirSync}from"node:fs";import{resolve}from"node:path";import{pathToFileURL}from"node:url";
          const src=resolve("docs/references/workbench-ui"),out=resolve("candidate-review-settled/reference");mkdirSync(out,{recursive:true});const refs=readdirSync(src).filter(n=>n.endsWith(".svg")&&!n.startsWith("order-")).sort();const b=await chromium.launch();const p=await b.newPage({viewport:{width:1440,height:900}});for(const n of refs){await p.goto(pathToFileURL(resolve(src,n)).href);await p.screenshot({path:resolve(out,n.replace(/\.svg$/,".png")),fullPage:false});}await b.close();
          SCRIPT
          node candidate-settled-render.temp.mjs
      - name: Manifest and persist
        shell: bash
        run: |
          node - <<'SCRIPT'
          const{readdirSync,writeFileSync}=require("node:fs");const refs=readdirSync("docs/references/workbench-ui").filter(n=>n.endsWith(".svg")&&!n.startsWith("order-")).sort();writeFileSync("candidate-review-settled/manifest.json",JSON.stringify({candidateSha:process.env.CANDIDATE_SHA,references:refs},null,2)+"\n");
          SCRIPT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-review-settled
          git commit -m "chore: capture settled candidate visual evidence"
          git fetch origin version/0.5.0
          git rebase origin/version/0.5.0
          git push origin HEAD:version/0.5.0
