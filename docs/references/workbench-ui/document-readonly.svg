 x="70" y="388" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">The current Workbench contains canonical data and most interaction primitives required to operate the lifecycle,</text><text x="70" y="409" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">but it does not consistently organize the product around the operator task owned by each workflow step.</text><text x="70" y="454" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Evidence</text><text x="70" y="482" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Parent application interaction map · workflow-state audit · OpenCode interaction audit · material maturity audit</text></svg>