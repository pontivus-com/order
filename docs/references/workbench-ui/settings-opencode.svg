" fill="#657187" text-anchor="start">Actions</text><text x="338" y="438" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">OpenCodeAccount.label</text><text x="720" y="438" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#657187" text-anchor="start">Active / Saved / Needs sign-in</text><rect x="1008" y="420" width="98" height="38" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1057" y="445" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Switch</text><rect x="1118" y="420" width="98" height="38" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1167" y="445" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Rename</text><rect x="1228" y="420" width="98" height="38" rx="6" fill="#B42318" stroke="#B42318"/><text x="1277" y="445" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Remove</text><rect x="316" y="556" width="1068" height="118" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="338" y="588" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Mutation blockers</text><text x="338" y="616" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">ACTIVE_RUN → finish/cancel active agent work</text><text x="338" y="636" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">LOGIN_ATTEMPT_ACTIVE → finish/cancel current sign-in</text><text x="338" y="656" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">ACCOUNT_MUTATION_ACTIVE → wait for current account change</text><text x="316" y="730" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="600" fill="#657187" text-anchor="start">Account changes affect login identity only; configured provider/model stays unchanged.</text></svg>