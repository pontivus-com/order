ns-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Dialogue, proposal Review, governed Document and Evidence with one current attention owner.</text><text x="52" y="576" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" font-weight="800" fill="#0F172A" text-anchor="start">Supporting services</text><text x="70" y="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">• Queue, Create, Settings, Context and Evidence remain coherent with the same task model.</text><rect x="1010" y="338" width="360" height="176" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="1030" y="368" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Status</text><text x="1120" y="368" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#16A34A" text-anchor="start">Reviewed — ready for Solution design</text><text x="1030" y="402" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Authority</text><text x="1120" y="402" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">requirements.md</text><text x="1120" y="422" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">GW-DOC-WORKBENCH-UX-V2</text><rect x="28" y="842" width="1384" height="36" rx="5" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="865" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Technical details  ›</text></svg>