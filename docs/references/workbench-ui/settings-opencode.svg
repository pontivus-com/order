<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#FFFFFF"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="102" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#D7E2F1" text-anchor="start">Settings</text><rect x="1110" y="14" width="172" height="26" rx="13" fill="#F8FAFC" stroke="#F8FAFC"/><text x="1196" y="32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#657187" text-anchor="middle">Reference composition</text><text x="1394" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#fff" text-anchor="end">Settings   Theme</text><text x="28" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start">Settings</text><text x="28" y="130" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#657187" text-anchor="start">Installation configuration and readiness.</text><rect x="28" y="154" width="238" height="650" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="58" y="188" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Repositories</text><rect x="42" y="222" width="210" height="46" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="58" y="246" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#1E3A8A" text-anchor="start">OpenCode accounts</text><text x="58" y="304" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-seri