="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Implementation</text><text x="720" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">plan</text><circle cx="887" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="887" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Readiness</text><text x="887" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">review</text><circle cx="1054" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1054" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Approval</text><circle cx="1221" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1221" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Implementation</text><circle cx="1388" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1388" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Complete</text><line x1="0" y1="184" x2="1440" y2="184" stroke="#D9DEE8" stroke-width="1"/><rect x="28" y="200" width="1384" height="48" rx="6" fill="#F0FDF4" stroke="#F0FDF4"/><text x="46" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#16A34A" text-anchor="start">Current attention: Requirements current</text><text x="330" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">The behavioral contract is current; supporting Research remains secondary.</text><rect x="28" y="266" width="260" height="42" rx="6" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Material: Requirements (current)</text><text x="266" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#657187" text-anchor="end">⌄</text><rect x="28" y="322" width="1384" height="500" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="52" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Requirements — OW-4827</text><rect x="1288" y="336" width="82" height="32" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1329" y="357" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Edit</text><text x="52" y="404" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">1. Required behavior</text><text x="70" y="426" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Block cancellation while a lifecycle proposal is pending.</text><text x="70" y="446" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Allow cancellation after the proposal is explicitly rejected.</text><text x="70" y="466" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Preserve existing adoption behavior.</text><text x="52" y="500" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">2. Acceptance criteria</text><text x="70" y="522" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Cancellation is not offered while the proposal is pending.</text><text x="70" y="542" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Reject restores normal cancellation eligibility.</text><text x="70" y="562" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Adoption continues or reconciles without interruption.</text><text x="52" y="596" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">3. Scope and exclusions</text><text x="70" y="618" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• In scope: cancellation gating, rejection flow and user feedback.</text><text x="70" y="638" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Out of scope: changing proposal adoption semantics.</text><text x="52" y="672" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">4. Failure behavior</text><text x="70" y="694" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Blocked cancellation leaves canonical state unchanged and explains the next action.</text><rect x="1030" y="380" width="340" height="194" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="1050" y="410" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Defect context</text><text x="1050" y="440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Proven defect</text><text x="1050" y="468" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Expected corrected behavior</text><text x="1050" y="496" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Must remain unchanged</text><rect x="1030" y="594" width="340" height="136" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1050" y="624" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Latest agent update</text><text x="1050" y="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Requirements aligned to Research.</text><text x="1050" y="669" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Conversation remains available on demand.</text><rect x="28" y="842" width="1384" height="36" rx="5" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="865" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Technical details  ›</text></svg>