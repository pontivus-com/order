<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Theme parity</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">System / Light / Dark change presentation tokens only</text><text x="28" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Light</text><rect x="28" y="158" width="662" height="560" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="46" y="178" width="626" height="44" rx="4" fill="#111F38" stroke="#111F38"/><text x="64" y="206" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="start">Order · Workbench</text><rect x="46" y="240" width="626" height="54" rx="5" fill="#EFF6FF" stroke="#EFF6FF"/><text x="64" y="273" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#1E3A8A" text-anchor="start">Current attention</text><rect x="46" y="312" width="626" height="376" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="64" y="344" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Primary task surface</text><text x="64" y="378" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Semantic status, hierarchy and action priority are unchanged.</text><text x="64" y="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Color is never the sole carrier of meaning.</text><text x="750" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Dark</text><rect x="750" y="158" width="662" height="560" rx="8" fill="#111A29" stroke="#344256"/><rect x="768" y="178" width="626" height="44" rx="4" fill="#172233" stroke="#344256"/><text x="786" y="206" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#EDF3FA" text-anchor="start">Order · Workbench</text><rect x="768" y="240" width="626" height="54" rx="5" fill="#203554" stroke="#203554"/><text x="786" y="273" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="800" fill="#93B4FF" text-anchor="start">Current attention</text><rect x="768" y="312" width="626" height="376" rx="6" fill="#111A29" stroke="#344256"/><text x="786" y="344" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#EDF3FA" text-anchor="start">Primary task surface</text><text x="786" y="378" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#A9B8CD" text-anchor="start">Same composition, selected material, dirty state and workflow meaning.</text><text x="786" y="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#A9B8CD" text-anchor="start">Theme switch does not remount or mutate workflow state.</t