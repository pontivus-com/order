<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Order — safety / confirmation surfaces</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference composition · exact product copy</text><rect x="40" y="90" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE8"/><text x="64" y="124" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Discard unsaved Markdown?</text><text x="660" y="124" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#657187" text-anchor="end">SURF-CONF-DIRTY-DEST-001</text><text x="64" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Leaving this WorkItem would discard the current unsaved Markdown buffer.</text><rect x="400" y="256" width="118" height="34" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="459" y="279" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cancel</text><rect x="532" y="256" width="144" height="34" rx="6" fill="#B42318" stroke="#B42318"/><text x="604" y="279" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Discard unsaved changes</text><rect x="740" y="90" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE8"/><text x="764" y="124" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Discard unsaved Markdown?</text><text x="1360" y="124" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#657187" text-anchor="end">SURF-CONF-DIRTY-MATERIAL-001</text><text x="764" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Changing workflow step or material would discard the current unsaved Markdown buffer.</text><rect x="1100" y="256" width="118" height="34" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1159" y="279" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cancel</text><rect x="1232" y="256" width="144" height="34" rx="6" fill="#B42318" stroke="#B42318"/><text x="1304" y="279" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Discard unsaved changes</text><rect x="40" y="360" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE8"/><text x="64" y="394" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Archive work item?</text><text x="660" y="394" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#657187" text-anchor="end">SURF-CONF-ARCHIVE-001</text><text x="64" y="432" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Archive this WorkItem from the active queue. Its source, lifecycle documents, Runs, evid</text><text x="64" y="451" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">ence, approvals and history remain intact.</text><rect x="400" y="526" width="118" height="34" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="459" y="549" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cancel</text><rect x="532" y="526" width="144" height="34" rx="6" fill="#B42318" stroke="#B42318"/><text x="604" y="549" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Archive work item</text><rect x="740" y="360" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE8"/><text x="764" y="394" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Save WorkItem documentation to Git?</text><text x="1360" y="394" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#657187" text-anchor="end">SURF-CONF-DOC-GIT-001</text><text x="764" y="432" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Only the exact governed paths reviewed in WorkItemDocumentationGitStatus will be committed.</text><rect x="1100" y="526" width="118" height="34" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1159" y="549" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cancel</text><rect x="1232" y="526" width="144" height="34" rx="6" fill="#B42318" stroke="#B42318"/><text x="1304" y="549" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Save documentation to Git</text><rect x="40" y="630" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE8"/><text x="64" y="664" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Disconnect repository?</text><text x="660" y="664" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#657187" text-anchor="end">SURF-CONF-REPO-DISCONNECT-001</text><text x="64" y="702" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Remove only Order's connection. Repository files, WorkItem Markdown, Git history and aut</text><text x="64" y="721" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">hority documents are not deleted.</text><rect x="400" y="796" width="118" height="34" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="459" y="819" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cancel</text><rect x="532" y="796" width="144" height="34" rx="6" fill="#B42318" stroke="#B42318"/><text x="604" y="819" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Disconnect repository</text><rect x="740" y="630" width="660" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE8"/><text x="764" y="664" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Remove saved OpenCode account?</text><text x="1360" y="664" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="600" fill="#657187" text-anchor="end">SURF-CONF-OC-REMOVE-001</text><text x="764" y="702" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">