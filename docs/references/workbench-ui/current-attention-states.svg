<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#FFFFFF"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="102" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#D7E2F1" text-anchor="start">Current-attention reference</text><rect x="1110" y="14" width="172" height="26" rx="13" fill="#F8FAFC" stroke="#F8FAFC"/><text x="1196" y="32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#657187" text-anchor="middle">Reference composition</text><text x="1394" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#fff" text-anchor="end">Settings   Theme</text><text x="28" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Current-attention precedence</text><text x="28" y="122" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#657187" text-anchor="start">Exactly one highest-precedence condition owns the primary action for a coherent WorkItem observation.</text><rect x="28" y="160" width="1384" height="54" rx="6" fill="#FEF3F2" stroke="#FEF3F2"/><text x="48" y="193" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">1</text><text x="84" y="193" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#B42318" text-anchor="start">Mutation conflict</text><text x="410" y="193" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Resolve / reload / reconcile</text><rect x="28" y="222" width="1384" height="54" rx="6" fill="#FFFAEB" stroke="#FFFAEB"/><text x="48" y="255" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">2</text><text x="84" y="255" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#B54708" text-anchor="start">Waiting for you</text><text x="410" y="255" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Exact required answer</text><rect x="28" y="284" width="1384" height="54" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="48" y="317" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">3</text><text x="84" y="317" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#1E3A8A" text-anchor="start">Proposal decision</text><text x="410" y="317" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Adopt / Reject only</text><rect x="28" y="346" width="1384" height="54" rx="6" fill="#FFFAEB" stroke="#FFFAEB"/><text x="48" y="379" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">4</text><text x="84" y="379" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#B54708" text-anchor="start">Applying change</text><text x="410" y="379" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">No competing mutation</text><rect x="28" y="408" width="1384" height="54" rx="6" fill="#FEF3F2" stroke="#FEF3F2"/><text x="48" y="441" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">5</text><text x="84" y="441" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#B42318" text-anchor="start">Blocked</text><text x="410" y="441" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Owning Resume / recovery</text><rect x="28" y="470" width="1384" height="54" rx="6" fill="#FFFAEB" stroke="#FFFAEB"/><text x="48" y="503" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">6</text><text x="84" y="503" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#B54708" text-anchor="start">Stale authority</text><text x="410" y="503" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Reconcile / return to exact owner</text><rect x="28" y="532" width="1384" height="54" rx="6" fill="#FFFAEB" stroke="#FFFAEB"/><text x="48" y="565" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">7</text><text x="84" y="565" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#B54708" text-anchor="start">Retry / Resume recovery</text><text x="410" y="565" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Retry or Resume current owner</text><rect x="28" y="594" width="1384" height="54" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="48" y="627" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">8</text><text x="84" y="627" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#1E3A8A" text-anchor="start">Processing</text><text x="410" y="627" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Inspect activity; Cancel only if allowed</text><rect x="28" y="656" width="1384" height="54" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="48" y="689" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">9</text><text x="84" y="689" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#1E3A8A" text-anchor="start">Actionable</text><text x="410" y="689" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Start / continue / sign off / current-task action</text><rect x="28" y="718" width="1384" height="54" rx="6" fill="#F8FAFC" stroke="#F8FAFC"/><text x="48" y="751" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">10</text><text x="84" y="751" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Ordinary current material</text><text x="410" y="751" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Read / edit current task material</text><rect x="28" y="780" width="1384" height="54" rx="6" fill="#F8FAFC" stroke="#F8FAFC"/><text x="48" y="813" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#657187" text-anchor="start">11</text><text x="84" y="813" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="start">Historical inspection</text><text x="410" y="813" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#0F172A" text-anchor="start">Read-only; current attention still reachable</text></svg>