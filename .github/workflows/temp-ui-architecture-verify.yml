name: temporary UI architecture verification

on:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun ci
      - run: bun run tsc --noEmit
      - run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/vite/bin/vite.js build

# rerun after UI architecture sensor fixes
