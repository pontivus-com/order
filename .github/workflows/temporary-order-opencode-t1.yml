name: Temporary Order OpenCode T1 Certification

on:
  push:
    branches:
      - fix/0.6.0-r2-p3-authority-layer-conformance
    paths:
      - .github/workflows/temporary-order-opencode-t1.yml

permissions:
  contents: read

concurrency:
  group: temporary-order-opencode-t1
  cancel-in-progress: true

jobs:
  certify:
    name: live-order-opencode-t1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WORK_ITEM_ID: work_0f6d97bf-5c9e-4ed7-8f4c-2dd8806d4a21
      EXPECTED_BASELINE: 3c9fa8e70f710426735bfd823aef365ddf9fa5f8
      PONTIVUS_ORDER_BIND: 127.0.0.1:17347
      OPENCODE_AUTH_EXPORT_B64: ${{ secrets.PONTIVUS_ORDER_CI_OPENCODE_AUTH_B64 }}
      PONTIVUS_ORDER_CI_MODEL: ${{ vars.PONTIVUS_ORDER_CI_MODEL }}

    steps:
      - name: Checkout exact temporary-scaffold branch head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+${GITHUB_REF}:refs/remotes/origin/certification"
          git checkout --detach refs/remotes/origin/certification
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" \
            "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/pontivus-order-opencode"
          BUN_INSTALL="${RUNNER_TEMP}/pontivus-order-opencode" \
            "${RUNNER_TEMP}/bun-bin/bun" install -g --trust @opencode/cli@2.2.6
          test "$("${RUNNER_TEMP}/pontivus-order-opencode/bin/opencode" --version)" = "opencode v2.2.6"
          echo "PONTIVUS_ORDER_OPENCODE_BIN=${RUNNER_TEMP}/pontivus-order-opencode/bin/opencode" >> "${GITHUB_ENV}"

      - name: Install candidate dependencies and build daemon assets
        shell: bash
        run: |
          set -euo pipefail
          test "$("${RUNNER_TEMP}/node/bin/node" --version)" = "v26.13.0"
          test "$("${RUNNER_TEMP}/bun-bin/bun" --version)" = "1.4.4"
          "${RUNNER_TEMP}/bun-bin/bun" ci
          "${RUNNER_TEMP}/node/bin/node" node_modules/vite/bin/vite.js build
          test -s dist/index.html

      - name: Prepare diagnostic target from signed baseline
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/target-order"
          rm -rf "${target}"
          git clone --no-local --no-checkout -- "${GITHUB_WORKSPACE}" "${target}"
          git -C "${target}" checkout --detach "${EXPECTED_BASELINE}"

          TARGET_MANIFEST="${target}/pontivus-order.toml" "${RUNNER_TEMP}/bun-bin/bun" -e '
            const path = process.env.TARGET_MANIFEST;
            let text = await Bun.file(path).text();
            const staleRefs = new Set([
              "GW-DOC-SPECIFICATION-STANDARD-V1",
              "GW-DOC-LIFECYCLE-CONTEXT-V1",
              "GW-DOC-TECHNICAL-ARCHITECTURE-V1",
              "GW-DOC-CANONICAL-CONTRACTS-V1",
              "GW-DOC-EXTERNAL-FACTS-V1-2026-11-12",
              "GW-DOC-PUBLIC-REPOSITORY-DELIVERY-V1",
              "GW-DOC-REF-OPENSPEC",
              "GW-DOC-REF-OPENSPEC-V1-2026-11-12",
              "GW-DOC-REF-SPEC-KIT",
              "GW-DOC-REF-SPEC-KIT-V1-2026-11-12",
              "GW-DOC-REF-KIRO-SPECS",
              "GW-DOC-REF-KIRO-SPECS-V1-2026-11-12",
              "GW-DOC-REF-BMAD",
              "GW-DOC-REF-BMAD-V1-2026-11-12",
              "GW-DOC-WORK-ITEM-DOCUMENT-SYSTEM-V1",
            ]);
            const next = text
              .split("\n")
              .filter((line) => {
                const match = /^([^=]+)=/.exec(line.trim());
                return match === null || !staleRefs.has(match[1].trim());
              })
              .join("\n");
            if (next === text) throw new TypeError("diagnostic manifest correction made no change");
            await Bun.write(path, next);
          '

          git -C "${target}" config user.name "github-actions[bot]"
          git -C "${target}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${target}" add pontivus-order.toml
          git -C "${target}" commit -m "ci diagnostic: correct invalid live AuthorityRef bindings"
          effective="$(git -C "${target}" rev-parse HEAD)"
          test "$(git -C "${target}" rev-parse HEAD^)" = "${EXPECTED_BASELINE}"
          echo "TARGET_REPOSITORY_ROOT=${target}" >> "${GITHUB_ENV}"
          echo "EFFECTIVE_BASELINE=${effective}" >> "${GITHUB_ENV}"
          echo "Diagnostic target baseline: ${effective}"

      - name: Construct signed T1 execution seed from canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/order-state"
          rm -rf "${state_root}"
          mkdir -p "${state_root}"
          chmod 700 "${state_root}"
          echo "PONTIVUS_ORDER_STATE_ROOT=${state_root}" >> "${GITHUB_ENV}"
          echo "ORDER_CI_STATE_ROOT=${state_root}" >> "${GITHUB_ENV}"
          export PONTIVUS_ORDER_STATE_ROOT="${state_root}"

          cat > .temporary-order-bootstrap.ts <<'TS'
          import {
            ApprovalSchema,
            ArtifactRefSchema,
            WorkItemIdSchema,
            type ArtifactRef,
            type ArtifactRole,
            type AuthorityLayer,
          } from "./src/core/contracts.ts";
          import {
            canonicalApprovalPackageJson,
          } from "./src/core/canonical.ts";
          import {
            admitSignedTaskBlockForSchema,
            materializeExecutionTasks,
            parseSignedTaskBlockFromPlan,
          } from "./src/core/execution.ts";
          import {
            authorityLayerForManifestLayer,
            resolveProjectAuthority,
          } from "./src/core/governance.ts";
          import {
            workItemDocumentPath,
          } from "./src/core/work-item-source.ts";
          import {
            validateTaskDefinitions,
          } from "./src/daemon/authority.ts";
          import {
            createCoordinatorRuntime,
          } from "./src/daemon/runtime.ts";
          import {
            reconcileWorkItemSources,
          } from "./src/daemon/work-item-source.ts";
          import {
            buildOrderConfig,
            writeOrderConfig,
          } from "./src/shell/config.ts";
          import {
            expandRepositoryPatterns,
            loadValidatedProjectManifest,
            resolveAuthoritySources,
            resolveConcernAuthoritySources,
          } from "./src/shell/project.ts";
          import {
            readCommittedFile,
          } from "./src/shell/repository.ts";
          import {
            newApprovalId,
            newArtifactRefId,
            newExecutionTaskId,
            nowIsoDateTime,
            sha256,
            sha256Text,
          } from "./src/shell/runtime.ts";
          import {
            loadWorkItem,
            openOrderDatabase,
            storeApproval,
            storeArtifact,
            storeArtifactDependency,
            storeExecutionTask,
            updateWorkItemLifecycle,
            withTransaction,
          } from "./src/shell/sqlite.ts";

          const stateRoot = process.env.PONTIVUS_ORDER_STATE_ROOT;
          const baseline = process.env.EFFECTIVE_BASELINE;
          const repositoryRoot = process.env.TARGET_REPOSITORY_ROOT;
          const rawWorkItemId = process.env.WORK_ITEM_ID;
          if (!stateRoot || !baseline || !repositoryRoot || !rawWorkItemId) {
            throw new TypeError("CI seed environment is incomplete");
          }
          const workItemId = WorkItemIdSchema.parse(rawWorkItemId);

          const initialConfig = writeOrderConfig(
            stateRoot,
            buildOrderConfig(null, [repositoryRoot], []),
          );
          const database = openOrderDatabase(stateRoot);
          const runtime = createCoordinatorRuntime(
            database,
            stateRoot,
            process.env,
            initialConfig,
          );

          try {
            const reconciliation = await reconcileWorkItemSources(runtime, [repositoryRoot]);
            if (reconciliation.diagnostics.some((entry) => entry.workItemId === workItemId)) {
              throw new TypeError("target WorkItem source has reconciliation diagnostics");
            }
            const workItem = loadWorkItem(database, workItemId);

            const baselineSource = await readCommittedFile(
              repositoryRoot,
              baseline,
              workItem.sourcePath,
            );
            if (sha256(baselineSource) !== workItem.sourceSha256) {
              throw new TypeError("current WorkItem source does not match signed baseline");
            }

            const manifest = await loadValidatedProjectManifest(repositoryRoot);
            if (manifest.projectId !== workItem.projectId) {
              throw new TypeError("target WorkItem project does not match manifest");
            }
            const expandedAuthority = await resolveAuthoritySources(
              repositoryRoot,
              manifest,
            );
            const authority = resolveProjectAuthority(manifest, expandedAuthority);

            const artifacts = new Map<string, ArtifactRef>();
            const addArtifact = async (
              repositoryPath: string,
              role: ArtifactRole,
              authorityLayer: AuthorityLayer | null,
            ): Promise<ArtifactRef> => {
              const key = JSON.stringify([repositoryPath, role, authorityLayer]);
              const existing = artifacts.get(key);
              if (existing !== undefined) return existing;
              const bytes = await readCommittedFile(
                repositoryRoot,
                baseline,
                repositoryPath,
              );
              const artifact = ArtifactRefSchema.parse({
                id: newArtifactRefId(),
                workItemId,
                repositoryPath,
                role,
                authorityLayer,
                sha256: sha256(bytes),
                gitCommit: baseline,
              });
              storeArtifact(database, artifact);
              artifacts.set(key, artifact);
              return artifact;
            };

            for (const layer of authority.layers) {
              for (const repositoryPath of layer.sources) {
                await addArtifact(
                  repositoryPath,
                  "GOVERNANCE",
                  authorityLayerForManifestLayer(layer.layer),
                );
              }
            }
            await addArtifact("pontivus-order.toml", "PROJECT_MANIFEST", null);

            for (const repositoryPath of await resolveConcernAuthoritySources(
              repositoryRoot,
              manifest,
              workItem.concernIds,
            )) {
              await addArtifact(repositoryPath, "GOVERNANCE", null);
            }

            for (const gate of Object.values(manifest.verification)) {
              for (const repositoryPath of await expandRepositoryPatterns(
                repositoryRoot,
                gate.materialRefs,
              )) {
                await addArtifact(
                  repositoryPath,
                  "VERIFICATION_MATERIAL",
                  null,
                );
              }
            }

            const lifecycle = [
              ["R1", "P1"],
              ["R2", "P3"],
              ["DESIGN", "P6"],
              ["PLAN", "P7"],
              ["R3", "P7"],
            ] as const;
            const lifecycleArtifacts = new Map<string, ArtifactRef>();
            for (const [role, layer] of lifecycle) {
              const repositoryPath = workItemDocumentPath(
                manifest.workItems.root,
                workItemId,
                role,
              );
              lifecycleArtifacts.set(
                role,
                await addArtifact(repositoryPath, role, layer),
              );
            }

            const plan = lifecycleArtifacts.get("PLAN");
            const r3 = lifecycleArtifacts.get("R3");
            if (plan === undefined || r3 === undefined) {
              throw new TypeError("CI seed lifecycle roots are incomplete");
            }

            const material = [...artifacts.values()].filter(
              (artifact) => artifact.id !== plan.id && artifact.id !== r3.id,
            );
            for (const dependency of [plan, ...material]) {
              storeArtifactDependency(database, r3.id, dependency.id);
            }

            const planBytes = await readCommittedFile(
              repositoryRoot,
              baseline,
              plan.repositoryPath,
            );
            const parsedBlock = admitSignedTaskBlockForSchema(
              workItem.schemaId,
              parseSignedTaskBlockFromPlan(planBytes),
            );
            if (
              parsedBlock.tasks.length !== 1 ||
              parsedBlock.tasks[0]?.id !== "T1"
            ) {
              throw new TypeError("signed baseline does not contain exactly T1");
            }
            await validateTaskDefinitions(
              workItem,
              manifest,
              [plan, r3, ...material],
              planBytes,
            );

            const packageHash = sha256Text(
              canonicalApprovalPackageJson({
                workItemId,
                baselineCommit: baseline,
                sourceSha256: workItem.sourceSha256,
                plan,
                r3,
                materialArtifacts: material,
              }),
            );
            const approval = ApprovalSchema.parse({
              id: newApprovalId(),
              workItemId,
              baselineCommit: baseline,
              packageHash,
              planArtifactRefId: plan.id,
              r3ArtifactRefId: r3.id,
              sourceSha256: workItem.sourceSha256,
              approvedBy: "github-actions-live-certification",
              approvedAt: nowIsoDateTime(),
            });
            const tasks = materializeExecutionTasks(
              approval.id,
              parsedBlock,
              parsedBlock.tasks.map(() => newExecutionTaskId()),
            );

            withTransaction(database, () => {
              storeApproval(database, approval);
              for (const task of tasks) storeExecutionTask(database, task);
              updateWorkItemLifecycle(database, workItemId, {
                stage: "EXECUTION",
                status: "ACTIVE",
                outcome: null,
              });
            });

            process.stdout.write(JSON.stringify({
              workItemId,
              approvalId: approval.id,
              baselineCommit: approval.baselineCommit,
              packageHash: approval.packageHash,
              sourceSha256: approval.sourceSha256,
              executionTaskId: tasks[0]?.id,
              planTaskId: tasks[0]?.planTaskId,
              taskState: tasks[0]?.state,
              materialCount: material.length,
            }) + "\n");
          } finally {
            database.close();
          }
          TS

          "${RUNNER_TEMP}/bun-bin/bun" .temporary-order-bootstrap.ts \
            > "${RUNNER_TEMP}/seed-summary.json"
          rm -f .temporary-order-bootstrap.ts
          cat "${RUNNER_TEMP}/seed-summary.json"

      - name: Establish OpenCode Console account and select model
        shell: bash
        run: |
          set -euo pipefail
          cat > .temporary-order-opencode-auth.ts <<'TS'
          import {
            buildOrderConfig,
            writeOrderConfig,
          } from "./src/shell/config.ts";
          import {
            buildOpenCodeEnvironment,
            listAvailableOpenCodeModels,
            listOpenCodeAccounts,
            pollOpenCodeAccountOAuth,
            startOpenCodeAccountControl,
            startOpenCodeAccountOAuth,
            stopOpenCodeAccountControl,
          } from "./src/shell/opencode.ts";

          const stateRoot = process.env.PONTIVUS_ORDER_STATE_ROOT;
          const binary = process.env.PONTIVUS_ORDER_OPENCODE_BIN;
          const targetRoot = process.env.TARGET_REPOSITORY_ROOT;
          if (!stateRoot || !binary || !targetRoot) {
            throw new TypeError("OpenCode CI environment is incomplete");
          }

          const exported = process.env.OPENCODE_AUTH_EXPORT_B64?.trim() ?? "";
          if (exported.length > 0) {
            const authFile = process.env.RUNNER_TEMP + "/opencode-auth.json";
            await Bun.write(authFile, Uint8Array.from(Buffer.from(exported, "base64")));
            const authEnvironment = buildOpenCodeEnvironment(stateRoot, process.env);
            const child = Bun.spawn(
              [binary, "auth", "import", authFile, "--standalone"],
              {
                cwd: targetRoot,
                env: authEnvironment,
                stdin: "ignore",
                stdout: "pipe",
                stderr: "pipe",
              },
            );
            const [exitCode, stdout, stderr] = await Promise.all([
              child.exited,
              new Response(child.stdout).text(),
              new Response(child.stderr).text(),
            ]);
            await Bun.file(authFile).delete().catch(() => undefined);
            if (exitCode !== 0) {
              throw new TypeError(
                "OpenCode auth import failed: " +
                  (stderr.trim() || stdout.trim() || "unknown failure"),
              );
            }
          } else {
            const control = await startOpenCodeAccountControl(stateRoot, process.env);
            try {
              const existing = await listOpenCodeAccounts(control);
              if (!existing.some((account) => account.active && account.status.status === "READY")) {
                const started = await startOpenCodeAccountOAuth(
                  control,
                  "github-actions-live-certification",
                );
                process.stdout.write("\n=== OPENCODE CONSOLE AUTHORIZATION REQUIRED ===\n");
                process.stdout.write("URL: " + started.authorizationUrl + "\n");
                process.stdout.write("Instructions: " + started.instructions + "\n");
                process.stdout.write("Expires: " + started.expiresAt + "\n");
                process.stdout.write("=== END AUTHORIZATION REQUEST ===\n\n");

                while (true) {
                  const status = await pollOpenCodeAccountOAuth(
                    control,
                    started.providerAttemptId,
                  );
                  if (status.status === "COMPLETED") break;
                  if (status.status === "FAILED") {
                    throw new TypeError("OpenCode Console authorization failed: " + status.message);
                  }
                  if (status.status === "EXPIRED") {
                    throw new TypeError("OpenCode Console authorization expired");
                  }
                  await Bun.sleep(3000);
                }
              }
            } finally {
              await stopOpenCodeAccountControl(control);
            }
          }

          const verify = await startOpenCodeAccountControl(stateRoot, process.env);
          try {
            const accounts = await listOpenCodeAccounts(verify);
            const active = accounts.find(
              (account) => account.active && account.status.status === "READY",
            );
            if (active === undefined) {
              throw new TypeError("OpenCode Console account is not productively READY");
            }
          } finally {
            await stopOpenCodeAccountControl(verify);
          }

          const models = await listAvailableOpenCodeModels(
            stateRoot,
            targetRoot,
            process.env,
          );
          if (models.length === 0) {
            throw new TypeError("OpenCode Console account exposes no enabled models");
          }
          const requested = process.env.PONTIVUS_ORDER_CI_MODEL?.trim() ?? "";
          const selected = requested.length === 0
            ? models.find((model) => model.providerID === "opencode") ?? models[0]
            : models.find((model) => `${model.providerID}/${model.id}` === requested);
          if (selected === undefined) {
            throw new TypeError("requested CI model is not enabled: " + requested);
          }
          writeOrderConfig(
            stateRoot,
            buildOrderConfig(selected, [targetRoot], []),
          );
          process.stdout.write(JSON.stringify({
            providerID: selected.providerID,
            modelId: selected.id,
          }) + "\n");
          TS

          "${RUNNER_TEMP}/bun-bin/bun" .temporary-order-opencode-auth.ts
          rm -f .temporary-order-opencode-auth.ts

      - name: Prove seed is the fresh signed T1
        shell: bash
        run: |
          set -euo pipefail
          cat > .temporary-order-verify-seed.ts <<'TS'
          import {
            WorkItemIdSchema,
          } from "./src/core/contracts.ts";
          import {
            openOrderDatabase,
            loadArtifact,
            loadCurrentApprovalForWorkItem,
            loadTaskStatesForApproval,
            loadWorkItem,
            reconstructExecutionTask,
          } from "./src/shell/sqlite.ts";
          import { readCommittedFile } from "./src/shell/repository.ts";

          const stateRoot = process.env.PONTIVUS_ORDER_STATE_ROOT;
          const workItemId = WorkItemIdSchema.parse(process.env.WORK_ITEM_ID);
          const expectedBaseline = process.env.EFFECTIVE_BASELINE;
          if (!stateRoot || !expectedBaseline) throw new TypeError("CI certification environment is incomplete");

          const database = openOrderDatabase(stateRoot);
          try {
            const workItem = loadWorkItem(database, workItemId);
            const approval = loadCurrentApprovalForWorkItem(database, workItemId);
            if (approval === null) throw new TypeError("seed has no current signed Approval");
            if (approval.baselineCommit !== expectedBaseline) {
              throw new TypeError(
                `seed Approval baseline mismatch: ${approval.baselineCommit} != ${expectedBaseline}`,
              );
            }
            const plan = loadArtifact(database, approval.planArtifactRefId);
            const planBytes = await readCommittedFile(
              workItem.repositoryRoot,
              approval.baselineCommit,
              plan.repositoryPath,
            );
            const tasks = loadTaskStatesForApproval(database, approval.id).map(([taskId]) =>
              reconstructExecutionTask(database, taskId, planBytes)
            );
            const t1 = tasks.find((task) => task.planTaskId === "T1");
            if (t1 === undefined) throw new TypeError("seed Approval has no T1");
            if (tasks.length !== 1) throw new TypeError("seed Approval must contain exactly one execution task");
            if (t1.state !== "TODO") {
              throw new TypeError(`seed T1 must be TODO, found ${t1.state}`);
            }
            const runCount = database
              .query("SELECT count(*) AS value FROM runs WHERE executionTaskId = ?1;")
              .get(t1.id) as { value: number } | null;
            if (runCount === null || runCount.value !== 0) {
              throw new TypeError("seed T1 must have zero post-signoff Runs");
            }
            process.stdout.write(JSON.stringify({
              workItemId: workItem.id,
              approvalId: approval.id,
              baselineCommit: approval.baselineCommit,
              executionTaskId: t1.id,
              planTaskId: t1.planTaskId,
              taskState: t1.state,
            }) + "\n");
          } finally {
            database.close();
          }
          TS
          "${RUNNER_TEMP}/bun-bin/bun" .temporary-order-verify-seed.ts
          rm -f .temporary-order-verify-seed.ts

      - name: Start candidate Order daemon
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /etc/opencode
          daemon_log="${ORDER_CI_STATE_ROOT}/ci-daemon.log"
          "${RUNNER_TEMP}/bun-bin/bun" src/cli.ts daemon >"${daemon_log}" 2>&1 &
          daemon_pid=$!
          echo "ORDER_CI_DAEMON_PID=${daemon_pid}" >> "${GITHUB_ENV}"
          echo "${daemon_pid}" > "${ORDER_CI_STATE_ROOT}/ci-daemon.pid"

          healthy=false
          for _ in $(seq 1 90); do
            if "${RUNNER_TEMP}/bun-bin/bun" src/cli.ts status >"${RUNNER_TEMP}/order-status.json" 2>/dev/null; then
              healthy=true
              break
            fi
            if ! kill -0 "${daemon_pid}" 2>/dev/null; then
              echo "Order daemon exited before becoming healthy" >&2
              tail -n 200 "${daemon_log}" >&2 || true
              exit 1
            fi
            sleep 2
          done
          test "${healthy}" = "true"
          cat "${RUNNER_TEMP}/order-status.json"

      - name: Start or observe exact T1 through production API
        shell: bash
        run: |
          set -euo pipefail
          origin="http://${PONTIVUS_ORDER_BIND}"
          connect_url="$("${RUNNER_TEMP}/bun-bin/bun" src/cli.ts open)"
          cookie="${RUNNER_TEMP}/order-cookie.txt"
          curl -fsS -L -c "${cookie}" -o /dev/null "${connect_url}"

          curl -fsS -b "${cookie}" \
            "${origin}/api/work-items/${WORK_ITEM_ID}/tasks" > "${RUNNER_TEMP}/tasks.json"

          task_id="$("${RUNNER_TEMP}/bun-bin/bun" -e '
            const tasks = JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/tasks.json").text());
            const t = tasks.find((value) => value.planTaskId === "T1");
            if (!t) process.exit(2);
            process.stdout.write(t.id);
          ')"
          task_state="$("${RUNNER_TEMP}/bun-bin/bun" -e '
            const tasks = JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/tasks.json").text());
            const t = tasks.find((value) => value.planTaskId === "T1");
            if (!t) process.exit(2);
            process.stdout.write(t.state);
          ')"
          echo "ORDER_CI_TASK_ID=${task_id}" >> "${GITHUB_ENV}"

          if [[ "${task_state}" == "TODO" ]]; then
            curl -fsS -b "${cookie}" \
              -H "Origin: ${origin}" \
              -H "Content-Type: application/json" \
              -X POST \
              "${origin}/api/work-items/${WORK_ITEM_ID}/tasks/${task_id}/start" \
              -d '{}' > "${RUNNER_TEMP}/start-task.json"
          elif [[ "${task_state}" != "RUNNING" ]]; then
            echo "T1 entered unexpected state before certification start: ${task_state}" >&2
            exit 1
          fi

          echo "task_id=${task_id}"

      - name: Wait for coordinator terminal state
        shell: bash
        run: |
          set -euo pipefail
          origin="http://${PONTIVUS_ORDER_BIND}"
          cookie="${RUNNER_TEMP}/order-cookie.txt"

          terminal=""
          for _ in $(seq 1 2160); do
            curl -fsS -b "${cookie}" \
              "${origin}/api/work-items/${WORK_ITEM_ID}/tasks" > "${RUNNER_TEMP}/tasks-current.json"
            terminal="$("${RUNNER_TEMP}/bun-bin/bun" -e '
              const tasks = JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/tasks-current.json").text());
              const t = tasks.find((value) => value.id === process.env.ORDER_CI_TASK_ID);
              if (!t) process.exit(2);
              process.stdout.write(t.state);
            ')"
            case "${terminal}" in
              CANDIDATE_DONE|ALREADY_SATISFIED|BLOCKED)
                break
                ;;
            esac
            sleep 10
          done

          echo "T1 terminal state: ${terminal}"
          [[ "${terminal}" == "CANDIDATE_DONE" ]] || {
            tail -n 250 "${ORDER_CI_STATE_ROOT}/ci-daemon.log" >&2 || true
            exit 1
          }

      - name: Capture and verify persisted execution evidence
        shell: bash
        run: |
          set -euo pipefail
          origin="http://${PONTIVUS_ORDER_BIND}"
          cookie="${RUNNER_TEMP}/order-cookie.txt"
          evidence_dir="${RUNNER_TEMP}/order-live-evidence"
          mkdir -p "${evidence_dir}/events"

          curl -fsS -b "${cookie}" \
            "${origin}/api/work-items/${WORK_ITEM_ID}" > "${evidence_dir}/work-item.json"
          curl -fsS -b "${cookie}" \
            "${origin}/api/work-items/${WORK_ITEM_ID}/tasks" > "${evidence_dir}/tasks.json"
          curl -fsS -b "${cookie}" \
            "${origin}/api/work-items/${WORK_ITEM_ID}/runs" > "${evidence_dir}/runs.json"

          "${RUNNER_TEMP}/bun-bin/bun" -e '
            const runs = JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/order-live-evidence/runs.json").text());
            for (const run of runs) console.log(run.id);
          ' | while read -r run_id; do
            curl -fsS -b "${cookie}" \
              "${origin}/api/runs/${run_id}/events?afterSequence=0" \
              > "${evidence_dir}/events/${run_id}.json"
          done

          cat > .temporary-order-verify-live-run.ts <<'TS'
          const root = process.env.RUNNER_TEMP + "/order-live-evidence";
          const taskId = process.env.ORDER_CI_TASK_ID;
          const baseline = process.env.EFFECTIVE_BASELINE;
          if (!taskId || !baseline) throw new TypeError("certification identity is incomplete");

          const workItem = JSON.parse(await Bun.file(root + "/work-item.json").text());
          const tasks = JSON.parse(await Bun.file(root + "/tasks.json").text());
          const allRuns = JSON.parse(await Bun.file(root + "/runs.json").text());
          const task = tasks.find((value: { id: string }) => value.id === taskId);
          if (!task) throw new TypeError("T1 disappeared from canonical task projection");
          if (task.state !== "CANDIDATE_DONE") {
            throw new TypeError(`T1 did not close CANDIDATE_DONE: ${task.state}`);
          }
          if (
            workItem.stage !== "COMPLETE" ||
            workItem.status !== "COMPLETE" ||
            workItem.outcome !== "CANDIDATE_DONE"
          ) {
            throw new TypeError("WorkItem did not close with canonical CANDIDATE_DONE outcome");
          }

          const runs = allRuns.filter(
            (run: { executionTaskId: string | null }) => run.executionTaskId === taskId,
          );
          if (runs.length < 2) throw new TypeError("expected BUILDER and REVIEWER execution Runs");
          if (runs.some((run: { baselineCommit: string }) => run.baselineCommit !== baseline)) {
            throw new TypeError("post-signoff Run escaped the signed Approval baseline");
          }

          const eventsByRun = new Map<string, any[]>();
          for (const run of runs) {
            eventsByRun.set(
              run.id,
              JSON.parse(await Bun.file(root + "/events/" + run.id + ".json").text()),
            );
          }

          const builders = runs.filter((run: { role: string }) => run.role === "BUILDER");
          if (builders.length !== 1) {
            throw new TypeError(`fresh certification requires exactly one BUILDER Run, found ${builders.length}`);
          }
          const builder = builders[0];
          const builderEvents = eventsByRun.get(builder.id) ?? [];
          const requests = builderEvents.filter(
            (event: any) => event.event.tag === "GATE_CHECKPOINT_REQUESTED",
          );
          const passes = builderEvents.filter(
            (event: any) => event.event.tag === "GATE_PASSED" && event.event.gateId === "architecture",
          );
          const failures = builderEvents.filter(
            (event: any) => event.event.tag === "GATE_FAILED",
          );
          if (requests.length !== 6 || passes.length !== 6 || failures.length !== 0) {
            throw new TypeError(
              `checkpoint chronology invalid: requests=${requests.length} passes=${passes.length} failures=${failures.length}`,
            );
          }
          if (requests.some((event: any) => event.event.gateId !== "architecture")) {
            throw new TypeError("checkpoint request used a non-architecture gate");
          }
          for (let index = 0; index < 6; index += 1) {
            if (!(requests[index].sequence < passes[index].sequence)) {
              throw new TypeError(`checkpoint ${index + 1} did not pass after its request`);
            }
            if (index < 5 && !(passes[index].sequence < requests[index + 1].sequence)) {
              throw new TypeError(`checkpoint ${index + 1} did not pass before checkpoint ${index + 2}`);
            }
          }
          const candidate = builderEvents.findLast(
            (event: any) => event.event.tag === "CANDIDATE_STATE_RECORDED",
          );
          if (!candidate) throw new TypeError("BUILDER did not persist candidate state");
          if (!(passes[5].sequence < candidate.sequence)) {
            throw new TypeError("candidate was recorded before checkpoint F passed");
          }
          if (!builderEvents.some((event: any) => event.event.tag === "PROVIDER_DIAGNOSTICS_RECORDED")) {
            throw new TypeError("BUILDER has no persisted OpenCode provider diagnostics");
          }

          const finalReviewer = runs
            .filter((run: { role: string }) => run.role === "REVIEWER")
            .findLast((run: { terminalClassification: string | null }) =>
              run.terminalClassification === "CANDIDATE_DONE"
            );
          if (!finalReviewer) throw new TypeError("no REVIEWER closed CANDIDATE_DONE");
          const reviewEvents = eventsByRun.get(finalReviewer.id) ?? [];
          if (!reviewEvents.some((event: any) => event.event.tag === "PROVIDER_DIAGNOSTICS_RECORDED")) {
            throw new TypeError("REVIEWER has no persisted OpenCode provider diagnostics");
          }
          const reviewPass = reviewEvents.findLast(
            (event: any) => event.event.tag === "REVIEW_PASSED",
          );
          if (
            !reviewPass ||
            reviewPass.event.minimumChange !== "MINIMUM_SUFFICIENT" ||
            reviewPass.event.minimumChangeSummary !== null
          ) {
            throw new TypeError("REVIEWER did not supply current MINIMUM_SUFFICIENT evidence");
          }

          const validationPasses = reviewEvents.filter(
            (event: any) => event.event.tag === "VALIDATION_PASSED",
          );
          const byStage = new Map(validationPasses.map((event: any) => [event.event.stage, event]));
          const expectedStages = ["V0", "V1", "V2", "V3", "V4", "V5", "V6", "V7"];
          if (expectedStages.some((stage) => !byStage.has(stage))) {
            throw new TypeError("final REVIEWER does not contain VALIDATION_PASSED V0-V7");
          }
          if (reviewEvents.some((event: any) => event.event.tag === "VALIDATION_FAILED")) {
            throw new TypeError("final REVIEWER contains a validation failure");
          }
          const recorded = reviewEvents.filter(
            (event: any) => event.event.tag === "CANDIDATE_RECORDED",
          );
          if (recorded.length !== 1 || recorded[0].event.validationEventIds.length !== 8) {
            throw new TypeError("final REVIEWER did not persist one eight-stage CANDIDATE_RECORDED event");
          }

          const summary = {
            workItemId: workItem.id,
            executionTaskId: task.id,
            baselineCommit: baseline,
            builderRunId: builder.id,
            checkpointRequests: requests.map((event: any) => ({
              sequence: event.sequence,
              gateId: event.event.gateId,
            })),
            checkpointPasses: passes.map((event: any) => ({
              sequence: event.sequence,
              gateId: event.event.gateId,
            })),
            candidateChangedPaths: candidate.event.changedPaths,
            reviewerRunId: finalReviewer.id,
            validationStages: expectedStages,
            outcome: workItem.outcome,
          };
          await Bun.write(root + "/summary.json", JSON.stringify(summary, null, 2) + "\n");
          process.stdout.write(JSON.stringify(summary, null, 2) + "\n");
          TS

          "${RUNNER_TEMP}/bun-bin/bun" .temporary-order-verify-live-run.ts
          rm -f .temporary-order-verify-live-run.ts
          {
            echo "## Live Order/OpenCode T1 certification"
            echo
            echo '~~~json'
            cat "${evidence_dir}/summary.json"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop daemon
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${ORDER_CI_DAEMON_PID:-}" ]]; then
            kill "${ORDER_CI_DAEMON_PID}" 2>/dev/null || true
            for _ in $(seq 1 20); do
              kill -0 "${ORDER_CI_DAEMON_PID}" 2>/dev/null || exit 0
              sleep 1
            done
            kill -KILL "${ORDER_CI_DAEMON_PID}" 2>/dev/null || true
          fi
