ont-weight="400" fill="#0F172A" text-anchor="start">Outcome label/explanation from WorkItem.outcome</text><text x="72" y="510" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Governed result material where the terminal outcome owns one</text><rect x="704" y="426" width="666" height="170" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="724" y="458" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Evidence / resources</text><text x="724" y="488" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Candidate/result evidence only when canonically present</text><text x="724" y="510" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">No deployment or production claim is inferred</text><rect x="52" y="620" width="1318" height="92" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="72" y="652" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Permitted follow-up</text><text x="72" y="680" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#0F172A" text-anchor="start">Audit / Investigation remediation appears only for eligible terminal outcomes; otherwise no linked action is invented.</text><rect x="28" y="842" width="1384" height="36" rx="5" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="865" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Technical details  ›</text></svg>