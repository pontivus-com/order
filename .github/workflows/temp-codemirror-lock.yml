name: temporary CodeMirror lockfile materialization
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-codemirror-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
      - name: Install exact pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.4.4
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Materialize lockfile
        run: bun install --lockfile-only
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update lockfile for CodeMirror editor dependencies"
          git push origin HEAD:master
