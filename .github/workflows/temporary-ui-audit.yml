name: Temporary UI Audit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'docs/workbench-functional-design-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - name: Checkout exact PR merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" \
            "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/pr-merge"
          git checkout --detach refs/remotes/origin/pr-merge

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" \
            "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node node_modules/vite/bin/vite.js build

      - name: Materialize temporary visual audit
        shell: bash
        run: |
          set -euo pipefail
          cat > playwright.ui-audit.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "ui-audit.spec.ts",
            workers: 1,
            retries: 0,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          EOF

          cat > tests/ui-audit.spec.ts <<'EOF'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type Page, type APIRequestContext } from "@playwright/test";

          const baseURL = "http://127.0.0.1:17347";
          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();
          mkdirSync("ui-audit", { recursive: true });

          const mintConnectToken = async (request: APIRequestContext): Promise<string> => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            return String((await response.json() as { token: string }).token);
          };

          const authenticate = async (page: Page, request: APIRequestContext): Promise<void> => {
            const token = await mintConnectToken(request);
            await page.goto("/connect?token=" + token);
            await expect(page).toHaveURL(baseURL + "/");
          };

          const openWorkItem = async (page: Page, title: string): Promise<void> => {
            const row = page.locator('[data-testid^="work-item-row-"]')
              .filter({ has: page.getByText(title, { exact: true }) }).first();
            await expect(row).toBeVisible();
            await row.click();
            await expect(page.getByTestId("work-item-heading")).toHaveText(title);
            await page.waitForTimeout(150);
          };

          const back = async (page: Page): Promise<void> => {
            await page.getByRole("button", { name: "Back to work queue" }).click();
            await expect(page.getByTestId("work-item-queue")).toBeVisible();
          };

          const selectStep = async (page: Page, name: string): Promise<void> => {
            const button = page.getByTestId("workflow-progression")
              .getByRole("button", { name, exact: true });
            await button.click();
            await expect(button).toHaveAttribute("aria-pressed", "true");
            await page.waitForTimeout(100);
          };

          const capture = async (page: Page, name: string): Promise<void> => {
            const metrics = await page.evaluate(() => {
              const box = (selector: string) => {
                const node = document.querySelector<HTMLElement>(selector);
                if (!node) return null;
                const rect = node.getBoundingClientRect();
                return {
                  x: Math.round(rect.x),
                  y: Math.round(rect.y),
                  width: Math.round(rect.width),
                  height: Math.round(rect.height),
                  scrollWidth: node.scrollWidth,
                  scrollHeight: node.scrollHeight,
                };
              };
              return {
                viewport: { width: window.innerWidth, height: window.innerHeight },
                document: {
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                },
                header: box(".order-workitem-header-main"),
                progression: box(".order-workflow-progression"),
                summary: box(".order-workflow-step-summary"),
                indexRail: box(".order-workflow-step-index-rail"),
                primary: box('[data-testid="primary-material-frame"]'),
                context: box(".order-workbench-context"),
                heading: box(".order-workitem-heading-block"),
                railAction: box(".order-workitem-rail-actions"),
              };
            });
            writeFileSync("ui-audit/" + name + ".json", JSON.stringify(metrics, null, 2) + "\n");
            await page.screenshot({ path: "ui-audit/" + name + ".png", fullPage: true });
          };

          test("wide Workbench geometry across representative workflow states", async ({ page, request }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            await authenticate(page, request);

            await openWorkItem(page, "Workflow retry action");
            await capture(page, "01-plan-single-object-wide");
            await back(page);

            await openWorkItem(page, "Proposal review");
            await capture(page, "02-plan-multiple-objects-wide");
            await page.getByRole("button", { name: "Context", exact: true }).click();
            await expect(page.getByTestId("work-item-context")).toBeVisible();
            await capture(page, "03-plan-context-open-wide");
          });

          test("review, approval and execution information architecture", async ({ page, request }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            await authenticate(page, request);

            await openWorkItem(page, "Awaiting sign-off");
            await selectStep(page, "Readiness review");
            await capture(page, "04-readiness-wide");
            await selectStep(page, "Approval");
            await capture(page, "05-approval-wide");
            await back(page);

            await openWorkItem(page, "Implementation action ready");
            await capture(page, "06-implementation-wide");
          });

          test("medium and narrow responsive composition", async ({ page, request }) => {
            await page.setViewportSize({ width: 1100, height: 900 });
            await authenticate(page, request);
            await openWorkItem(page, "Proposal review");
            await capture(page, "07-plan-multiple-medium");

            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(150);
            await capture(page, "08-plan-multiple-narrow");
          });

          test("workflow mutation failure ownership", async ({ page, request }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            await authenticate(page, request);
            await openWorkItem(page, "Workflow input required");
            const messageInput = page.getByLabel("Message input");
            await messageInput.fill("Keep the approved constraint.");
            await page.route("**/api/runs/*/input", async (route) => route.abort("failed"));
            await messageInput.press("Enter");
            await page.waitForTimeout(300);
            await capture(page, "09-input-mutation-failure-wide");
          });
          EOF

      - name: Run visual audit
        run: node node_modules/@playwright/test/cli.js test --config=playwright.ui-audit.config.ts

      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-ui-audit
          path: ui-audit/
          if-no-files-found: error
          retention-days: 1
