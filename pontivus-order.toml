[verification.typecheck]
argv = ["bun", "run", "tsc", "--noEmit"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = []

[verification.architecture]
argv = ["node", "node_modules/vitest/vitest.mjs", "run", "tests/architecture.test.ts"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = ["tests/architecture.test.ts"]

[verification.test]
argv = ["node", "node_modules/vitest/vitest.mjs", "run"]
cwd = "."
timeoutSeconds = 1800
inheritEnv = ["PATH", "HOME", "TMPDIR", "PONTIVUS_ORDER_TEST_STATE_ROOT", "PONTIVUS_ORDER_OPENCODE_BIN", "PONTIVUS_ORDER_OPENCODE_MODEL"]
materialRefs = []

[verification.build]
argv = ["node", "node_modules/vite/bin/vite.js", "build"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = []

[verification.browser]
argv = ["node", "node_modules/@playwright/test/cli.js", "test"]
cwd = "."
timeoutSeconds = 1800
inheritEnv = ["PATH", "HOME", "TMPDIR", "PONTIVUS_ORDER_TEST_STATE_ROOT", "PONTIVUS_ORDER_OPENCODE_BIN", "PONTIVUS_ORDER_OPENCODE_MODEL"]
