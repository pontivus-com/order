<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Dialogue interaction states</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Canonical STAGE interaction projection</text><rect x="28" y="136" width="1384" height="150" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="158" width="210" height="24" rx="12" fill="#EFF6FF" stroke="#EFF6FF"/><text x="155" y="175" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">PROCESSING</text><text x="286" y="176" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Agent turn active</text><text x="50" y="214" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Conversation remains visible; free-form composer absent; bounded activity visible; Cancel only when allowed.</text><rect x="28" y="306" width="1384" height="150" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="328" width="210" height="24" rx="12" fill="#F0FDF4" stroke="#F0FDF4"/><text x="155" y="345" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#16A34A" text-anchor="middle">OPEN FOR CONTINUATION</text><text x="286" y="346" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Turn settled</text><text x="50" y="384" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Visible preceding AGENT_MESSAGE_FINAL anchors a free-form reply composer; proposal/input/blocker must be absent.</text><rect x="28" y="476" width="1384" height="150" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="498" width="210" height="24" rx="12" fill="#FFFAEB" stroke="#FFFAEB"/><text x="155" y="515" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#B54708" text-anchor="middle">WAITING FOR YOU</text><text x="286" y="516" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Exact HUMAN_INPUT_REQUESTED</text><text x="50" y="554" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Exact question appears inline with transcript; composer is bound to that request id.</text><rect x="28" y="646" width="1384" height="150" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="668" width="210" height="24" rx="12" fill="#F8FAFC" stroke="#F8FAFC"/><text x="155" y="685" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">CLOSED</text><text x="286" y="686" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Run terminal</text><text x="50" y="724" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Transcript/history remains inspectable; no composer; terminal/recovery behavior belongs to current workflow state.</text></svg>