<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Proposal review states</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Proposal ownership / disposition grammar</text><rect x="28" y="140" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="162" width="170" height="24" rx="12" fill="#EFF6FF" stroke="#EFF6FF"/><text x="135" y="179" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Pending review</text><text x="50" y="212" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Adopt and Reject are the only proposal mutation decisions. Free continuation and Cancel are unavailable.</text><rect x="28" y="300" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="322" width="170" height="24" rx="12" fill="#FFFAEB" stroke="#FFFAEB"/><text x="135" y="339" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#B54708" text-anchor="middle">Applying change</text><text x="50" y="372" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Adoption intent exists. Reject, Cancel and competing edits are unavailable until reconciliation/disposition completes.</text><rect x="28" y="460" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="482" width="170" height="24" rx="12" fill="#F0FDF4" stroke="#F0FDF4"/><text x="135" y="499" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#16A34A" text-anchor="middle">Adopted</text><text x="50" y="532" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Proposal is dispositioned; affected material is Updated — validation required until currentness/conformance is restored.</text><rect x="28" y="620" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="642" width="170" height="24" rx="12" fill="#F8FAFC" stroke="#F8FAFC"/><text x="135" y="659" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Rejected</text><text x="50" y="692" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Proposal is dispositioned without authority mutation; ordinary open continuation may become eligible again.</text></svg>