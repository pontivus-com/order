name: Temporary candidate review

on:
  push:
    branches: [version/0.5.0]
    paths-ignore:
      - "candidate-review-evidence/**"

permissions:
  contents: write

concurrency:
  group: candidate-review-version-0-5-0
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-candidate-review-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version/0.5.0
          fetch-depth: 0

      - name: Record candidate SHA
        shell: bash
        run: echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"
          curl -fsSLo "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"

      - name: dependency-lock
        run: bun ci

      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: typecheck
        run: bun run tsc --noEmit

      - name: architecture
        run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts

      - name: test
        run: node node_modules/vitest/vitest.mjs run

      - name: build
        run: node node_modules/vite/bin/vite.js build

      - name: browser
        run: node node_modules/@playwright/test/cli.js test

      - name: Generate candidate visual evidence test
        shell: bash
        run: |
          cat > tests/candidate-review-visual.temp.spec.ts <<'VISUAL'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Page } from "@playwright/test";

          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();

          const mintConnectToken = async (request: APIRequestContext): Promise<string> => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            return String((await response.json() as { token: string }).token);
          };

          const authenticate = async (page: Page, request: APIRequestContext): Promise<void> => {
            const token = await mintConnectToken(request);
            await page.goto("/connect?token=" + token);
            await expect(page.getByText("Order", { exact: true })).toBeVisible();
          };

          const rowFor = (page: Page, title: string) =>
            page.locator('[data-testid^="work-item-row-"]').filter({
              has: page.getByText(title, { exact: true }),
            }).first();

          const openWorkItem = async (page: Page, title: string): Promise<void> => {
            await page.goto("/");
            const row = rowFor(page, title);
            await expect(row).toBeVisible();
            await row.click();
            await expect(page.getByTestId("work-item-heading")).toHaveText(title);
          };

          const selectStep = async (page: Page, name: string): Promise<void> => {
            const button = page.getByTestId("workflow-rail").getByRole("button", { name, exact: true });
            await button.click();
            await expect(button).toHaveAttribute("aria-pressed", "true");
          };

          const openDisclosure = async (page: Page, name: string): Promise<void> => {
            const button = page.getByRole("button", { name, exact: true });
            if (await button.getAttribute("aria-expanded") !== "true") await button.click();
          };

          const capture = async (page: Page, names: readonly string[]): Promise<void> => {
            await page.waitForTimeout(150);
            for (const name of names) {
              await page.screenshot({
                path: "candidate-review-evidence/actual/" + name.replace(/\.svg$/, ".png"),
                fullPage: true,
              });
            }
          };

          test("captures all 41 reviewed Workbench references from the real SPA", async ({ page, request }) => {
            test.setTimeout(150_000);
            await page.setViewportSize({ width: 1600, height: 900 });
            await authenticate(page, request);

            await capture(page, ["queue.svg", "queue-states.svg", "application-notices-states.svg"]);

            await page.getByRole("button", { name: "New work item" }).click();
            await expect(page.getByRole("dialog", { name: "Create work item" })).toBeVisible();
            await capture(page, ["create-work-item.svg"]);
            await page.goto("/");

            await openWorkItem(page, "Lifecycle editing workbench");
            await capture(page, ["workitem-shell-controls.svg", "current-attention-states.svg"]);
            await page.getByRole("button", { name: "Context", exact: true }).click();
            await capture(page, ["workitem-context.svg"]);
            await page.getByRole("button", { name: "Context", exact: true }).click();

            await selectStep(page, "Work request");
            await capture(page, ["work-request.svg", "document-authoring.svg"]);
            await selectStep(page, "Research");
            await capture(page, ["research.svg", "dialogue-states.svg"]);
            await selectStep(page, "Requirements");
            await capture(page, ["requirements.svg"]);
            await selectStep(page, "Solution design");
            await capture(page, ["solution-design.svg"]);
            await selectStep(page, "Implementation plan");
            await capture(page, ["implementation-plan.svg", "document-states.svg", "work-type-variants.svg"]);
            await openDisclosure(page, "Supporting material and history");
            const workRequest = page.getByRole("button", { name: "Open Work request", exact: true });
            if (await workRequest.count()) {
              await workRequest.click();
            }
            await capture(page, ["document-readonly.svg"]);

            await openWorkItem(page, "Proposal review");
            await expect(page.getByTestId("proposal-review-workspace")).toBeVisible();
            await capture(page, ["proposal-review.svg", "proposal-states.svg"]);

            await openWorkItem(page, "Invalid lifecycle Markdown");
            const inspect = page.getByRole("button", { name: /Inspect exact bytes/ }).first();
            if (await inspect.count()) await inspect.click();
            await capture(page, ["evidence-viewer.svg"]);

            await openWorkItem(page, "Awaiting sign-off");
            await selectStep(page, "Readiness review");
            await capture(page, ["readiness-review.svg"]);
            await selectStep(page, "Approval");
            await capture(page, ["approval.svg"]);
            await openDisclosure(page, "Package material");
            const task = page.getByRole("button", { name: /Inspect task:/ }).first();
            if (await task.count()) await task.click();
            await capture(page, ["approval-task-detail.svg"]);

            await openWorkItem(page, "Implementation action ready");
            await selectStep(page, "Implementation");
            await capture(page, ["implementation.svg", "implementation-states.svg"]);

            await openWorkItem(page, "Completed investigation");
            await selectStep(page, "Complete");
            await capture(page, ["complete.svg", "complete-linked-remediation.svg"]);
            const remediation = page.getByRole("button", { name: "Create linked remediation" });
            if (await remediation.count()) await remediation.click();
            await capture(page, ["create-linked-remediation.svg"]);
            await page.goto("/");

            await page.getByRole("link", { name: "Settings", exact: true }).click();
            await capture(page, ["settings-repositories.svg", "installation-readiness.svg"]);
            await page.getByRole("button", { name: "Add repository" }).click();
            await capture(page, ["settings-repository-add.svg"]);
            await page.getByRole("button", { name: "Cancel add repository" }).click();
            const move = page.getByRole("button", { name: /Move WorkItem documents/ }).first();
            if (await move.count()) await move.click();
            await capture(page, ["settings-repository-move.svg"]);
            const cancelMove = page.getByRole("button", { name: /Cancel move/ }).first();
            if (await cancelMove.count()) await cancelMove.click();

            await page.getByRole("link", { name: "OpenCode", exact: true }).click();
            await capture(page, ["settings-opencode.svg"]);
            const addAccount = page.getByRole("button", { name: "Add account" });
            if (await addAccount.count()) await addAccount.click();
            await capture(page, ["settings-opencode-add.svg"]);
            const cancelAdd = page.getByRole("button", { name: /Cancel/ }).first();
            if (await cancelAdd.count()) await cancelAdd.click();
            await capture(page, [
              "settings-opencode-rename.svg",
              "settings-opencode-login.svg",
              "settings-opencode-login-states.svg",
            ]);

            await page.getByRole("link", { name: "Model & runtime", exact: true }).click();
            await capture(page, ["settings-model.svg"]);

            await page.goto("/");
            await page.setViewportSize({ width: 700, height: 800 });
            await openWorkItem(page, "Lifecycle editing workbench");
            await capture(page, ["responsive-composition.svg"]);
            await page.setViewportSize({ width: 1600, height: 900 });
            await page.getByRole("radio", { name: "Dark" }).click();
            await capture(page, ["theme-parity.svg"]);
            await page.getByRole("radio", { name: "System" }).click();

            await page.getByRole("button", { name: "Archive work item" }).click();
            await expect(page.getByRole("alertdialog", { name: "Archive work item?" })).toBeVisible();
            await capture(page, ["safety-confirmations.svg"]);
          });
          VISUAL

          cat > playwright.candidate-review.temp.config.ts <<'CONFIG'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "candidate-review-visual.temp.spec.ts",
            workers: 1,
            retries: 0,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          CONFIG

      - name: Capture all runtime reference states
        run: node node_modules/@playwright/test/cli.js test --config=playwright.candidate-review.temp.config.ts

      - name: Verify complete 41-reference runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find docs/references/workbench-ui -maxdepth 1 -name '*.svg' ! -name 'order-*' -printf '%f\n' | sort)"
          actual="$(find candidate-review-evidence/actual -maxdepth 1 -name '*.png' -printf '%f\n' | sed 's/\.png$/.svg/' | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -eq 41

      - name: Rasterize approved SVG references
        shell: bash
        run: |
          cat > /tmp/render-references.mjs <<'SCRIPT'
          import { chromium } from "@playwright/test";
          import { readdirSync, mkdirSync } from "node:fs";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const source = resolve("docs/references/workbench-ui");
          const output = resolve("candidate-review-evidence/reference");
          mkdirSync(output, { recursive: true });
          const refs = readdirSync(source).filter((name) => name.endsWith(".svg") && !name.startsWith("order-")).sort();
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          for (const name of refs) {
            await page.goto(pathToFileURL(resolve(source, name)).href);
            await page.screenshot({
              path: resolve(output, name.replace(/\.svg$/, ".png")),
              fullPage: false,
            });
          }
          await browser.close();
          SCRIPT
          node /tmp/render-references.mjs

      - name: Write evidence manifest
        shell: bash
        run: |
          node - <<'SCRIPT'
          const { readdirSync, writeFileSync } = require("node:fs");
          const refs = readdirSync("docs/references/workbench-ui")
            .filter((name) => name.endsWith(".svg") && !name.startsWith("order-"))
            .sort();
          const manifest = {
            candidateSha: process.env.CANDIDATE_SHA,
            referenceAuthority: "docs/references/workbench-ui",
            comparisonLaw: "implementation-plan.md §4 and §14.4",
            canonicalViewports: {
              wide: "1600x900",
              medium: "1000x800",
              narrow: "700x800"
            },
            references: refs.map((name) => ({
              reference: name,
              referencePng: "reference/" + name.replace(/\.svg$/, ".png"),
              actualPng: "actual/" + name.replace(/\.svg$/, ".png")
            }))
          };
          writeFileSync("candidate-review-evidence/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          SCRIPT

      - name: Persist candidate review evidence temporarily
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-review-evidence
          git commit -m "chore: capture candidate review visual evidence"
          git push origin HEAD:version/0.5.0
