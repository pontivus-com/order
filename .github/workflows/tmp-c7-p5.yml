name: Temporary Final C7 P5 evidence capture
# Evidence generation only: a green run is not a C5 conformance verdict.

on:
  push:
    branches:
      - fix/0.5.0-structural-ui-recovery

permissions:
  contents: read

concurrency:
  group: tmp-c7-p5-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-c5-visual-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"
          curl -fsSLo "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate settled C5 visual spec
        shell: bash
        run: |
          cat > tests/c5-visual.temp.spec.ts <<'VISUAL'
          import { mkdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Page } from "@playwright/test";

          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();
          const baseURL = "http://127.0.0.1:17347";
          const fixtureControlURL = "http://127.0.0.1:17348";
          const outRoot = "c5-evidence/actual";

          const shot = async (page: Page, reference: string, state: string) => {
            const dir = join(outRoot, reference.replace(/\.svg$/u, ""));
            mkdirSync(dir, { recursive: true });
            await page.screenshot({ path: join(dir, state + ".png"), fullPage: false });
          };
          const mint = async (request: APIRequestContext): Promise<string> => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            return String((await response.json() as { token: string }).token);
          };
          const auth = async (page: Page, request: APIRequestContext) => {
            await page.goto("/connect?token=" + await mint(request));
            await expect(page).toHaveURL(baseURL + "/");
            await expect(page.getByText("Order", { exact: true })).toBeVisible();
          };
          const rowFor = (page: Page, title: string) =>
            page.locator('[data-testid^="work-item-row-"]')
              .filter({ has: page.getByText(title, { exact: true }) }).first();
          const open = async (page: Page, title: string) => {
            await page.goto("/");
            const row = rowFor(page, title);
            await expect(row).toBeVisible({ timeout: 30000 });
            await row.click();
            await expect(page.getByTestId("work-item-heading")).toHaveText(title);
          };
          const step = async (page: Page, name: string) => {
            const button = page.getByTestId("workflow-rail").getByRole("button", { name, exact: true });
            await button.click();
            await expect(button).toHaveAttribute("aria-pressed", "true");
          };
          const fixture = async (request: APIRequestContext, path: string, data: Record<string, unknown>) => {
            const response = await request.post(fixtureControlURL + path, { data });
            expect(response.ok()).toBe(true);
            return response.json();
          };
          const selectWorkflowMaterial = async (page: Page, optionName: string) => {
            const selector = page.getByTestId("workflow-step-index").getByRole("combobox");
            await expect(selector).toBeVisible();
            await selector.click();
            await page.getByRole("option", { name: optionName, exact: true }).click();
          };

          test("Approval and signed task detail", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);
            await open(page, "Awaiting sign-off");
            await expect(page.getByTestId("review-workspace")).toBeVisible({ timeout: 30000 });
            await expect(page.getByText("Package currentness", { exact: true })).toBeVisible();
            await expect(page.getByRole("button", { name: "Sign off exact package", exact: true })).toBeVisible();
            await shot(page, "approval.svg", "current-package");

            const taskAction = page.getByRole("button", { name: /^Inspect signed task:/u }).first();
            await expect(taskAction).toBeVisible();
            await taskAction.click();
            const taskDetail = page.getByTestId("approval-task-detail");
            await expect(taskDetail).toBeVisible();
            await expect(taskDetail.getByText("Task id", { exact: true })).toBeHidden();
            await expect(page.getByRole("button", { name: "Task technical details", exact: true })).toBeVisible();
            await shot(page, "approval-task-detail.svg", "signed-task");
          });

          test("Implementation states", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            await open(page, "Implementation action ready");
            await expect(page.getByTestId("execution-workspace")).toBeVisible({ timeout: 30000 });
            await expect(page.getByRole("button", { name: "Start current task", exact: true })).toBeVisible();
            const readyDetail = page.getByTestId("execution-task-detail");
            await expect(readyDetail.getByText("No persisted attempt events", { exact: true })).toBeVisible();
            await expect(readyDetail.getByText("Loading attempt timeline…", { exact: true })).toHaveCount(0);
            await expect(readyDetail.getByText("Change surface", { exact: true })).toBeHidden();
            await expect(readyDetail.getByText("Task id", { exact: true })).toBeHidden();
            await expect(page.getByRole("table", { name: "Approved tasks" })).toBeVisible();
            await shot(page, "implementation.svg", "ready");
            await shot(page, "implementation-states.svg", "ready-to-start");

            const itemResponse = await page.request.get("/api/work-items");
            expect(itemResponse.status()).toBe(200);
            const items = await itemResponse.json() as Array<{ id: string; title: string }>;
            const item = items.find((value) => value.title === "Implementation action ready");
            expect(item).toBeDefined();
            // The permanent browser suite proves that the visible command issues only the exact
            // task-scoped start endpoint. This capture fixture materializes the same canonical
            // Processing state without intercepting the production command a second time.
            await fixture(page.context().request, "/tick", { workItemId: item!.id });
            await open(page, "Implementation action ready");
            await expect(page.getByTestId("selected-run-header")).toContainText("Running", { timeout: 30000 });
            await expect(page.getByRole("button", { name: "Cancel current implementation attempt", exact: true })).toBeVisible();
            await shot(page, "implementation-states.svg", "processing");

            await open(page, "Failed implementation feedback");
            await expect(page.getByTestId("execution-workspace")).toBeVisible();
            await expect(page.getByText("Implementation task is blocked", { exact: true })).toBeVisible();
            await expect(page.getByRole("button", { name: "Resume resolved blocker", exact: true })).toBeVisible();
            await shot(page, "implementation-states.svg", "blocked");

            await open(page, "Verified candidate");
            await step(page, "Implementation");
            await selectWorkflowMaterial(page, "Independent review · Attempt 1");
            const validation = page.getByTestId("validation-matrix");
            await expect(validation).toBeVisible({ timeout: 30000 });
            await expect(page.getByTestId("validation-stage-V7")).toContainText("Passed", { timeout: 30000 });
            await expect(validation).toContainText("Recorded boundary: complete");
            await shot(page, "implementation-states.svg", "validation-recorded");
          });

          test("Complete and eligible linked remediation", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            await open(page, "Verified candidate");
            await expect(page.getByTestId("result-workspace")).toBeVisible({ timeout: 30000 });
            await expect(page.getByTestId("final-governed-outcome")).toContainText("Candidate done");
            await expect(page.getByTestId("candidate-result-material")).toBeVisible();
            await expect(page.getByRole("button", { name: "Create linked remediation", exact: true })).toHaveCount(0);
            await shot(page, "complete.svg", "verified-candidate");

            await open(page, "Completed audit");
            await expect(page.getByTestId("result-workspace")).toBeVisible();
            await expect(page.getByTestId("result-material")).toContainText("Evidence-backed audit verdict.", { timeout: 30000 });
            await expect(page.getByRole("button", { name: "Create linked remediation", exact: true })).toBeVisible();
            await shot(page, "complete-linked-remediation.svg", "audit");
          });
          VISUAL

          cat > playwright.c5-visual.temp.config.ts <<'CONFIG'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "c5-visual.temp.spec.ts",
            workers: 1,
            retries: 0,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120000,
            },
          });
          CONFIG

      - name: Capture settled C5 runtime states
        run: node node_modules/@playwright/test/cli.js test --config=playwright.c5-visual.temp.config.ts

      - name: Rasterize C5 SVG references
        shell: bash
        run: |
          cat > c5-reference-render.temp.mjs <<'SCRIPT'
          import { chromium } from "@playwright/test";
          import { mkdirSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";
          const refs = [
            "approval.svg",
            "approval-task-detail.svg",
            "implementation.svg",
            "implementation-states.svg",
            "complete.svg",
            "complete-linked-remediation.svg"
          ];
          const out = resolve("c5-evidence/reference");
          mkdirSync(out, { recursive: true });
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          for (const ref of refs) {
            await page.setContent(readFileSync(resolve("docs/references/workbench-ui", ref), "utf8"));
            await page.screenshot({ path: resolve(out, ref.replace(/\.svg$/u, ".png")), fullPage: false });
          }
          await browser.close();
          SCRIPT
          node c5-reference-render.temp.mjs

      - name: Verify C5 evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find c5-evidence/reference -type f -name '*.png' | wc -l)" -eq 6
          test -s c5-evidence/actual/approval/current-package.png
          test -s c5-evidence/actual/approval-task-detail/signed-task.png
          test -s c5-evidence/actual/implementation/ready.png
          test -s c5-evidence/actual/implementation-states/ready-to-start.png
          test -s c5-evidence/actual/implementation-states/processing.png
          test -s c5-evidence/actual/implementation-states/blocked.png
          test -s c5-evidence/actual/implementation-states/validation-recorded.png
          test -s c5-evidence/actual/complete/verified-candidate.png
          test -s c5-evidence/actual/complete-linked-remediation/audit.png

      - name: Upload C5 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-p5-evidence-${{ github.sha }}
          path: c5-evidence
          if-no-files-found: warn
          retention-days: 7
