name: Temporary candidate review

on:
  push:
    branches: [version/0.5.0]

permissions:
  contents: read

concurrency:
  group: candidate-review-version-0-5-0
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Candidate review cancelled because the prior visual check did not compare implementation against the approved SVGs."
