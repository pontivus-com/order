name: Temporary exact Acceptance specification verification
on:
  pull_request:
    branches: [docs/0.6.0-workbench-implementation-contract]
    types: [synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    if: github.event.pull_request.number == 90
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
      PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT: /tmp/pontivus-order-opencode-drive
      PONTIVUS_ORDER_REQUIRE_OPENCODE_DRIVE: "1"
    steps:
      - name: Checkout pinned pre-scaffold exact PR merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master" "+refs/heads/docs/0.6.0-workbench-implementation-contract:refs/remotes/origin/docs/0.6.0-workbench-implementation-contract"
          git fetch --no-tags origin dd60dc17679d7c6468d0b44e69e0ed5a6981b67e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "dd60dc17679d7c6468d0b44e69e0ed5a6981b67e"
          test "$(git rev-parse HEAD^1)" = "671a21c00599c6b8791f6bb9f095f7a7a81928a7"
          test "$(git rev-parse HEAD^2)" = "626ad89739aebf5267c1776d1f6bf64396784832"
          git log -1 --format='%H %P'
      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" \
            "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.4"

      - name: Install exact OpenCode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"

      - name: Install exact OpenCode Drive verification tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          mkdir -p "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          cd "${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}"
          printf '{"private":true,"type":"module"}\n' > package.json
          bun add --exact opencode-drive@2.4.1 effect@4.0.1
          test "$(node -p "require('${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}/node_modules/opencode-drive/package.json').version")" = "2.4.1"
          test "$(node -p "require('${PONTIVUS_ORDER_OPENCODE_DRIVE_ROOT}/node_modules/effect/package.json').version")" = "4.0.1"

      - name: Verify PR release metadata
        run: bun scripts/verify-release.ts --mode pr --base "refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: dependency-lock
        id: dependency_lock
        run: bun ci

      - name: typecheck
        run: bun run tsc --noEmit

      - name: architecture
        id: architecture
        run: node node_modules/vitest/vitest.mjs run tests/architecture.test.ts


      - name: Install Playwright Chromium for static authority reference
        if: ${{ !cancelled() && steps.dependency_lock.outcome == 'success' }}
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Render exact static Acceptance reference states
        if: ${{ !cancelled() && steps.dependency_lock.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/order-acceptance-reference
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const dir = '/tmp/order-acceptance-reference';
          const manifest = JSON.parse(readFileSync('docs/references/workbench-ui/reference-manifest.json', 'utf8'));
          const surface = manifest.surfaces.find(s => s.id === 'SURF-STEP-ACCEPTANCE-001');
          if (!surface || surface.states.length !== 30) throw Error('wrong reference surface/state set');
          const browser = await chromium.launch({headless:true});
          const records = [];
          try {
            for (const [width, size] of [[1440,'wide'],[1000,'medium'],[760,'narrow']]) {
              for (const [theme, effective] of [['light','light'],['dark','dark'],['system','light'],['system','dark']]) {
                const page = await browser.newPage({viewport:{width,height:1000},colorScheme:effective});
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                for (const state of surface.states) {
                  const u = pathToFileURL(resolve('docs/references/workbench-ui/reference-atlas.html'));
                  u.search = new URLSearchParams({surf:surface.id,state,theme}).toString();
                  await page.goto(u.href);
                  const locator = page.locator(surface.selector);
                  if (!(await locator.isVisible()) || await locator.getAttribute('data-state') !== state || errors.length) throw Error(state+': '+errors.join(';'));
                  const png = size+'-'+theme+'-'+effective+'-'+state+'.png';
                  await page.screenshot({path:dir+'/'+png,fullPage:true});
                  records.push({state,size,theme,effective,png});
                }
                await page.close();
              }
            }
          } finally { await browser.close(); }
          writeFileSync(dir+'/manifest.json',JSON.stringify({candidateSha:'dd60dc17679d7c6468d0b44e69e0ed5a6981b67e',headSha:'626ad89739aebf5267c1776d1f6bf64396784832',design:manifest.authority.design.blob,records},null,2));
          console.log('Static reference rendered '+records.length+' exact state/viewport/theme combinations; no visual QA PASS asserted.');
          JS
      - name: Upload static reference render evidence
        if: ${{ !cancelled() && steps.dependency_lock.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-acceptance-reference-626ad89739aebf5267c1776d1f6bf64396784832
          path: /tmp/order-acceptance-reference
          if-no-files-found: error
