<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Implementation task states</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Current execution owner is derived independently from historical selection</text><rect x="28" y="140" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="162" width="170" height="24" rx="12" fill="#EFF6FF" stroke="#EFF6FF"/><text x="135" y="179" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Ready to start</text><text x="250" y="182" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Manual action starts this WorkItem's canonical current approved task.</text><rect x="50" y="232" width="184" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="142" y="249" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Start current task</text><rect x="28" y="300" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="322" width="170" height="24" rx="12" fill="#EFF6FF" stroke="#EFF6FF"/><text x="135" y="339" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Processing</text><text x="250" y="342" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Current task Run is active; show role/activity and current validation boundary.</text><rect x="50" y="392" width="184" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="142" y="409" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Cancel only when admitted</text><rect x="28" y="460" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="482" width="170" height="24" rx="12" fill="#FEF3F2" stroke="#FEF3F2"/><text x="135" y="499" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#B42318" text-anchor="middle">Blocked</text><text x="250" y="502" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Current blocker overrides stale selection; show exact blocker and Resume only when resolved.</text><rect x="50" y="552" width="184" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="142" y="569" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Resume resolved blocker</text><rect x="28" y="620" width="1384" height="140" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="642" width="170" height="24" rx="12" fill="#F0FDF4" stroke="#F0FDF4"/><text x="135" y="659" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#16A34A" text-anchor="middle">Validation recorded</text><text x="250" y="662" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Show current/recorded validation evidence; do not fill primary space with unreached empty validation rows.</text><rect x="50" y="712" width="184" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="142" y="729" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Inspect evidence</text></svg>