sistent lifecycle-navigation owner; reached/current/unreached state never changes cell geometry.</text><rect x="52" y="634" width="1260" height="68" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="72" y="674" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="start">Current attention remains independently visible even while the operator inspects historical material.</text></svg>