name: Temporary C6 visual evidence capture
# Evidence generation only: a green run is not a C6 conformance verdict.

on:
  push:
    branches:
      - fix/0.5.0-structural-ui-recovery

permissions:
  contents: read

concurrency:
  group: tmp-c6-visual-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-c6-visual-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"
          curl -fsSLo "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate settled C6 visual spec
        shell: bash
        run: |
          cat > tests/c6-visual.temp.spec.ts <<'VISUAL'
          import { mkdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Page } from "@playwright/test";

          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();
          const baseURL = "http://127.0.0.1:17347";
          const outRoot = "c6-evidence/actual";

          const shot = async (page: Page, reference: string, state: string) => {
            const dir = join(outRoot, reference.replace(/\.svg$/u, ""));
            mkdirSync(dir, { recursive: true });
            await page.screenshot({ path: join(dir, state + ".png"), fullPage: false });
          };
          const mint = async (request: APIRequestContext): Promise<string> => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            return String((await response.json() as { token: string }).token);
          };
          const auth = async (page: Page, request: APIRequestContext) => {
            await page.goto("/connect?token=" + await mint(request));
            await expect(page).toHaveURL(baseURL + "/");
            await expect(page.getByText("Order", { exact: true })).toBeVisible();
          };
          const rowFor = (page: Page, title: string) =>
            page.locator('[data-testid^="work-item-row-"]')
              .filter({ has: page.getByText(title, { exact: true }) }).first();
          const open = async (page: Page, title: string) => {
            await page.goto("/");
            const row = rowFor(page, title);
            await expect(row).toBeVisible({ timeout: 30000 });
            await row.click();
            await expect(page.getByTestId("work-item-heading")).toHaveText(title);
          };
          const step = async (page: Page, name: string) => {
            const button = page.getByTestId("workflow-rail").getByRole("button", { name, exact: true });
            await button.click();
            await expect(button).toHaveAttribute("aria-pressed", "true");
          };

          test("Queue, create and linked remediation", async ({ page, request }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await auth(page, request);
            await expect(page.getByTestId("work-item-queue")).toBeVisible();
            await shot(page, "queue.svg", "active");
            await shot(page, "queue-states.svg", "active-populated");

            await open(page, "Proposal review");
            await page.getByRole("button", { name: "Archive", exact: true }).click();
            await page.getByRole("alertdialog", { name: "Archive work item?" })
              .getByRole("button", { name: "Archive work item" }).click();
            await expect(page.getByTestId("work-item-queue")).toBeVisible();
            await page.getByRole("button", { name: "Show archived" }).click();
            await expect(page.getByRole("button", { name: "Restore Proposal review", exact: true })).toBeVisible();
            await shot(page, "queue-states.svg", "archived");

            await page.getByRole("button", { name: "Hide archived" }).click();
            const search = page.getByTestId("workbench-search").getByRole("searchbox");
            await search.fill("NO_C6_MATCH");
            await expect(page.getByText("No matching work items", { exact: true })).toBeVisible();
            await shot(page, "queue-states.svg", "no-matches");
          });

          test("Create and linked remediation", async ({ page, request }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await auth(page, request);
            await expect(page.getByTestId("work-item-queue")).toBeVisible();

            await page.getByRole("button", { name: "New work item" }).click();
            const create = page.getByRole("dialog", { name: "Create work item" });
            await expect(create).toBeVisible();
            await expect(create.getByTestId("create-work-item-location")).toContainText("docs/order/work-items");
            await shot(page, "create-work-item.svg", "default");
            await page.keyboard.press("Escape");

            await open(page, "Completed investigation");
            await page.getByRole("button", { name: "Create linked remediation" }).click();
            const linked = page.getByRole("dialog", { name: "Create linked remediation" });
            await expect(linked).toContainText("Parent INVESTIGATION");
            await expect(linked).toContainText("Completed investigation");
            await shot(page, "create-linked-remediation.svg", "investigation-parent");
          });

          test("Repository and model Settings", async ({ page, request }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await auth(page, request);
            await page.getByRole("link", { name: "Settings", exact: true }).click();
            const repositories = page.getByTestId("settings-repositories");
            await expect(repositories).toBeVisible();
            await shot(page, "settings-repositories.svg", "main");

            await repositories.getByRole("button", { name: "Add repository" }).click();
            await expect(repositories.getByTestId("add-repository-form")).toBeVisible();
            await shot(page, "settings-repository-add.svg", "form");
            await repositories.getByRole("button", { name: "Cancel add repository" }).click();

            const row = repositories.getByRole("table", { name: "Connected repositories" })
              .getByRole("row").filter({ hasText: "order-e2e" }).first();
            await row.getByRole("button", { name: /^Move WorkItem documents/u }).click();
            const move = repositories.getByTestId("move-workitem-documents");
            await expect(move).toContainText("Current repository-relative root: docs/order/work-items");
            await shot(page, "settings-repository-move.svg", "form");
            await move.getByRole("button", { name: "Cancel move" }).click();

            await page.getByRole("link", { name: "Model & runtime", exact: true }).click();
            await expect(page.getByTestId("settings-model")).toBeVisible();
            await shot(page, "settings-model.svg", "main");
          });

          test("OpenCode Settings and login states", async ({ page, request }) => {
            let loginStatus: "PENDING" | "COMPLETED" | "FAILED" | "EXPIRED" | "CANCELLED" = "PENDING";
            let attempt = 0;
            await page.route("**/api/opencode/accounts**", async (route) => {
              const req = route.request();
              const url = new URL(req.url());
              if (url.pathname === "/api/opencode/accounts" && req.method() === "GET") {
                await route.fulfill({
                  status: 200, contentType: "application/json",
                  body: JSON.stringify({
                    accounts: [
                      { id: "cred_alpha", label: "alpha@example.com", active: true, status: { status: "READY" } },
                      { id: "cred_beta", label: "beta@example.com", active: false, status: { status: "READY" } }
                    ],
                    activeAccountId: "cred_alpha",
                    mutationBlockers: []
                  })
                });
                return;
              }
              if (url.pathname === "/api/opencode/accounts/login" && req.method() === "POST") {
                attempt += 1;
                loginStatus = "PENDING";
                await route.fulfill({
                  status: 201, contentType: "application/json",
                  body: JSON.stringify({
                    id: "00000000-0000-4000-8000-" + String(attempt).padStart(12, "0"),
                    authorizationUrl: "https://opencode.ai/console/device",
                    instructions: "Open the verification page and continue.",
                    expiresAt: "2026-11-18T04:00:00.000Z",
                    status: "PENDING",
                    message: null
                  })
                });
                return;
              }
              if (/\/api\/opencode\/accounts\/login\/.+/.test(url.pathname) && req.method() === "GET") {
                await route.fulfill({
                  status: 200, contentType: "application/json",
                  body: JSON.stringify({
                    id: url.pathname.split("/").at(-1),
                    authorizationUrl: "https://opencode.ai/console/device",
                    instructions: "Open the verification page and continue.",
                    expiresAt: "2026-11-18T04:00:00.000Z",
                    status: loginStatus,
                    message: loginStatus === "FAILED" ? "Provider rejected sign-in." : null
                  })
                });
                return;
              }
              await route.fallback();
            });

            await page.setViewportSize({ width: 1440, height: 900 });
            await auth(page, request);
            await page.getByRole("link", { name: "Settings", exact: true }).click();
            await page.getByRole("link", { name: "OpenCode", exact: true }).click();
            const panel = page.getByTestId("settings-opencode");
            await expect(panel.getByRole("table", { name: "Saved OpenCode accounts" })).toBeVisible();
            await shot(page, "settings-opencode.svg", "accounts");

            await panel.getByRole("button", { name: "Rename beta@example.com" }).click();
            await expect(panel.getByTestId("rename-opencode-account")).toBeVisible();
            await shot(page, "settings-opencode-rename.svg", "form");
            await panel.getByRole("button", { name: "Cancel rename" }).click();

            await panel.getByRole("button", { name: "Add account" }).click();
            await expect(panel.getByTestId("add-opencode-account")).toContainText("Add OpenCode account");
            await shot(page, "settings-opencode-add.svg", "form");
            await panel.getByLabel("Account label").fill("new@example.com");
            await panel.getByRole("button", { name: "Continue to OpenCode sign-in" }).click();
            const login = panel.getByTestId("opencode-login-attempt");
            await expect(login).toContainText("Waiting for OpenCode sign-in");
            await shot(page, "settings-opencode-login.svg", "pending");
            await shot(page, "settings-opencode-login-states.svg", "pending");

            for (const [status, expected] of [
              ["COMPLETED", "OpenCode sign-in complete."],
              ["FAILED", "Provider rejected sign-in."],
              ["EXPIRED", "OpenCode sign-in expired."],
              ["CANCELLED", "OpenCode sign-in cancelled."]
            ] as const) {
              loginStatus = status;
              await page.waitForTimeout(1200);
              await expect(login).toContainText(expected, { timeout: 5000 });
              await shot(page, "settings-opencode-login-states.svg", status.toLowerCase());
              if (status !== "CANCELLED") {
                await login.getByRole("button", { name: "Done" }).click();
                await panel.getByRole("button", { name: "Add account" }).click();
                await panel.getByLabel("Account label").fill(status.toLowerCase() + "@example.com");
                await panel.getByRole("button", { name: "Continue to OpenCode sign-in" }).click();
                loginStatus = "PENDING";
                await expect(panel.getByTestId("opencode-login-attempt")).toContainText("Waiting for OpenCode sign-in");
              }
            }
          });

          test("Readiness, notices, Context, Evidence and theme parity", async ({ page, request }) => {
            await page.route("**/api/settings/readiness", async (route) => {
              await route.fulfill({
                status: 200, contentType: "application/json",
                body: JSON.stringify({
                  ready: false,
                  blockers: [
                    "REPOSITORY_REQUIRED",
                    "REPOSITORY_CONFIGURATION_REQUIRES_ATTENTION",
                    "MODEL_INVALID",
                    "REFERENCE_ROOT_CONFIGURATION_REQUIRES_ATTENTION",
                    "OPENCODE_ACCOUNT_REQUIRED"
                  ]
                })
              });
            });
            await page.setViewportSize({ width: 1440, height: 900 });
            await auth(page, request);
            await expect(page.getByText("Setup requires attention", { exact: true }).first()).toBeVisible();
            await shot(page, "installation-readiness.svg", "all-blockers");
            await shot(page, "application-notices-states.svg", "setup-and-source-diagnostics");
            await page.unroute("**/api/settings/readiness");

            await open(page, "Proposal review");
            await page.getByRole("button", { name: "Context" }).click();
            await expect(page.getByTestId("work-item-context")).toBeVisible();
            await shot(page, "workitem-context.svg", "wide");
            await page.getByRole("button", { name: "Close context", exact: true }).click();
            await expect(page.getByTestId("work-item-context")).toHaveCount(0);

            await open(page, "Invalid lifecycle Markdown");
            await step(page, "Research");
            await page.getByRole("button", { name: "Inspect exact bytes" }).click();
            await expect(page.getByTestId("raw-content-view")).toContainText("invalid lifecycle");
            await shot(page, "evidence-viewer.svg", "exact-bytes");

            await page.goto("/");
            await page.getByRole("radio", { name: "Light" }).click();
            await shot(page, "theme-parity.svg", "light");
            await page.getByRole("radio", { name: "Dark" }).click();
            await shot(page, "theme-parity.svg", "dark");
            await page.getByRole("radio", { name: "System" }).click();
            await shot(page, "theme-parity.svg", "system");
          });
          VISUAL

          cat > playwright.c6-visual.temp.config.ts <<'CONFIG'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "c6-visual.temp.spec.ts",
            workers: 1,
            retries: 0,
            timeout: 90000,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120000
            }
          });
          CONFIG

      - name: Capture settled C6 runtime states
        run: node node_modules/@playwright/test/cli.js test --config=playwright.c6-visual.temp.config.ts

      - name: Rasterize C6 SVG references
        shell: bash
        run: |
          cat > c6-reference-render.temp.mjs <<'SCRIPT'
          import { chromium } from "@playwright/test";
          import { mkdirSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";
          const refs = [
            "queue.svg","queue-states.svg","create-work-item.svg","create-linked-remediation.svg",
            "settings-repositories.svg","settings-repository-add.svg","settings-repository-move.svg",
            "settings-opencode.svg","settings-opencode-add.svg","settings-opencode-rename.svg",
            "settings-opencode-login.svg","settings-opencode-login-states.svg","settings-model.svg",
            "installation-readiness.svg","application-notices-states.svg","workitem-context.svg",
            "evidence-viewer.svg","theme-parity.svg"
          ];
          const out = resolve("c6-evidence/reference");
          mkdirSync(out, { recursive: true });
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          for (const ref of refs) {
            await page.setContent(readFileSync(resolve("docs/references/workbench-ui", ref), "utf8"));
            await page.screenshot({ path: resolve(out, ref.replace(/\.svg$/u, ".png")), fullPage: false });
          }
          await browser.close();
          SCRIPT
          node c6-reference-render.temp.mjs

      - name: Verify C6 evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find c6-evidence/reference -type f -name '*.png' | wc -l)" -eq 18
          for f in \
            actual/queue/active.png \
            actual/queue-states/active-populated.png \
            actual/queue-states/archived.png \
            actual/queue-states/no-matches.png \
            actual/create-work-item/default.png \
            actual/create-linked-remediation/investigation-parent.png \
            actual/settings-repositories/main.png \
            actual/settings-repository-add/form.png \
            actual/settings-repository-move/form.png \
            actual/settings-opencode/accounts.png \
            actual/settings-opencode-add/form.png \
            actual/settings-opencode-rename/form.png \
            actual/settings-opencode-login/pending.png \
            actual/settings-opencode-login-states/pending.png \
            actual/settings-opencode-login-states/completed.png \
            actual/settings-opencode-login-states/failed.png \
            actual/settings-opencode-login-states/expired.png \
            actual/settings-opencode-login-states/cancelled.png \
            actual/settings-model/main.png \
            actual/installation-readiness/all-blockers.png \
            actual/application-notices-states/setup-and-source-diagnostics.png \
            actual/workitem-context/wide.png \
            actual/evidence-viewer/exact-bytes.png \
            actual/theme-parity/light.png \
            actual/theme-parity/dark.png \
            actual/theme-parity/system.png
          do
            test -s "c6-evidence/$f"
          done

      - name: Upload C6 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-visual-evidence-${{ github.sha }}
          path: c6-evidence
          if-no-files-found: warn
          retention-days: 7
