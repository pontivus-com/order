name: Temporary P3 P4 visual evidence capture

on:
  push:
    branches:
      - version/0.5.0
      - fix/0.5.0-structural-ui-recovery

permissions:
  contents: read

concurrency:
  group: tmp-p3-p4-visual-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-visual-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"
          curl -fsSLo "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Generate settled visual spec
        shell: bash
        run: |
          cat > tests/p3-p4-visual.temp.spec.ts <<'VISUAL'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Page } from "@playwright/test";

          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT!;
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();
          const repositoryRoot = stateRoot + "-e2e-project";
          const baseURL = "http://127.0.0.1:17347";
          const fixtureControlURL = "http://127.0.0.1:17348";
          const outRoot = "c3-c4-evidence/actual";

          const shot = async (page: Page, reference: string, state: string) => {
            const dir = join(outRoot, reference.replace(/\.svg$/u, ""));
            mkdirSync(dir, { recursive: true });
            await page.screenshot({ path: join(dir, state + ".png"), fullPage: false });
          };
          const mint = async (request: APIRequestContext): Promise<string> => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            return String((await response.json() as { token: string }).token);
          };
          const auth = async (page: Page, request: APIRequestContext) => {
            await page.goto("/connect?token=" + await mint(request));
            await expect(page).toHaveURL(baseURL + "/");
            await expect(page.getByText("Order", { exact: true })).toBeVisible();
          };
          const rowFor = (page: Page, title: string) =>
            page.locator('[data-testid^="work-item-row-"]')
              .filter({ has: page.getByText(title, { exact: true }) }).first();
          const open = async (page: Page, title: string) => {
            await page.goto("/");
            const row = rowFor(page, title);
            await expect(row).toBeVisible({ timeout: 30000 });
            await row.click();
            await expect(page.getByTestId("work-item-heading")).toHaveText(title);
          };
          const step = async (page: Page, name: string) => {
            const button = page.getByTestId("workflow-rail").getByRole("button", { name, exact: true });
            await button.click();
            await expect(button).toHaveAttribute("aria-pressed", "true");
            await expect(page.getByText("Loading workflow step…", { exact: true })).toHaveCount(0);
            await expect(page.getByText("Loading readiness review…", { exact: true })).toHaveCount(0);
          };
          const disclosure = async (page: Page, label: string, action: string) => {
            const trigger = page.getByRole("button", { name: label, exact: true });
            await expect(trigger).toBeVisible();
            if (await trigger.getAttribute("aria-expanded") !== "true") await trigger.click();
            await page.getByRole("button", { name: action, exact: true }).click();
          };
          const itemFor = async (page: Page, title: string) => {
            const response = await page.context().request.get("/api/work-items");
            expect(response.status()).toBe(200);
            const values = await response.json() as Array<{ id: string; title: string }>;
            const item = values.find((value) => value.title === title);
            expect(item).toBeDefined();
            return item!;
          };
          const fixture = async (request: APIRequestContext, path: string, data: Record<string, unknown>) => {
            const response = await request.post(fixtureControlURL + path, { data });
            expect(response.ok()).toBe(true);
            return response.json();
          };
          const selectCurrentDocument = async (page: Page, label: string) => {
            const selector = page.getByRole("combobox", { name: "Current workflow material" });
            await expect(selector).toBeVisible({ timeout: 30000 });
            await selector.click();
            await page.getByRole("option", { name: label, exact: true }).click();
            await expect(page.getByTestId("lifecycle-document-material")).toBeVisible({ timeout: 30000 });
          };
          const selectReadinessReview = async (page: Page) => {
            const selector = page.getByRole("combobox", { name: "Readiness material" });
            await expect(selector).toBeVisible({ timeout: 30000 });
            await selector.click();
            await page.getByRole("option", { name: "Readiness review", exact: true }).click();
            await expect(page.getByText("Readiness verdict", { exact: true })).toBeVisible({ timeout: 30000 });
          };
          const edit = async (page: Page, editorName: string) => {
            const action = page.getByRole("button", { name: "Edit", exact: true });
            await expect(action).toBeVisible({ timeout: 30000 });
            await action.click();
            const editor = page.getByLabel(editorName);
            await expect(editor).toBeVisible({ timeout: 30000 });
            return editor;
          };

          test("shell theme responsive", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);
            await open(page, "Implementation plan document visual");
            await expect(page.getByTestId("workflow-step-summary")).toContainText("Implementation plan");
            await shot(page, "workitem-shell-controls.svg", "wide");

            await page.getByRole("radio", { name: "Light" }).click();
            await expect(page.locator(":root")).toHaveAttribute("data-theme", "light");
            await shot(page, "theme-parity.svg", "light");
            await page.getByRole("radio", { name: "Dark" }).click();
            await expect(page.locator(":root")).toHaveAttribute("data-theme", "dark");
            await shot(page, "theme-parity.svg", "dark");
            await page.getByRole("radio", { name: "Light" }).click();

            await open(page, "Implementation plan document visual");
            await selectCurrentDocument(page, "Implementation plan document");
            await page.setViewportSize({ width: 1600, height: 900 });
            await shot(page, "responsive-composition.svg", "wide");
            await page.setViewportSize({ width: 1000, height: 800 });
            await expect(page.getByTestId("workflow-rail")).toBeVisible();
            await expect(page.getByTestId("lifecycle-document-material")).toBeVisible();
            await shot(page, "responsive-composition.svg", "medium");
            await page.setViewportSize({ width: 700, height: 800 });
            await expect(page.getByTestId("workflow-rail")).toBeVisible();
            await expect(page.getByTestId("lifecycle-document-material")).toBeVisible();
            await shot(page, "responsive-composition.svg", "narrow");
          });

          test("current attention states", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            await open(page, "Workflow input required");
            await expect(page.getByTestId("workflow-step-summary")).toContainText("Waiting for you");
            await shot(page, "current-attention-states.svg", "02-waiting-for-you");

            await open(page, "Proposal review");
            await expect(page.getByTestId("proposal-review-workspace")).toBeVisible();
            await shot(page, "current-attention-states.svg", "03-proposal-decision");

            await open(page, "Proposal adoption in progress");
            await expect(page.getByText("Adoption in progress", { exact: true }).first()).toBeVisible();
            await shot(page, "current-attention-states.svg", "04-applying-change");

            await open(page, "Workflow resume action");
            await expect(page.getByTestId("workflow-step-summary")).toContainText("blocked");
            await shot(page, "current-attention-states.svg", "05-blocked");

            await open(page, "Stale approval recovery");
            await expect(page.getByTestId("workflow-step-summary")).toContainText("Approval authority is stale");
            await shot(page, "current-attention-states.svg", "06-stale-authority");

            await open(page, "Workflow retry action");
            await expect(page.getByRole("button", { name: "Retry Implementation plan", exact: true })).toBeVisible();
            await shot(page, "current-attention-states.svg", "07-retry-recovery");

            const processingItem = await itemFor(page, "Research processing attention visual");
            await fixture(page.context().request, "/start-stage", { workItemId: processingItem.id });
            await open(page, "Research processing attention visual");
            await expect(page.getByTestId("selected-run-header")).toContainText("Processing");
            await shot(page, "current-attention-states.svg", "08-processing");

            await open(page, "Requirements document visual");
            await expect(page.getByRole("button", { name: "Start Requirements", exact: true })).toBeVisible();
            await shot(page, "current-attention-states.svg", "09-actionable");

            await open(page, "Completed investigation");
            await expect(page.getByTestId("result-workspace")).toBeVisible();
            await shot(page, "current-attention-states.svg", "10-ordinary-current-material");

            await open(page, "Requirements ready after Research");
            await step(page, "Research");
            await expect(page.getByRole("button", { name: "Return to Requirements", exact: true })).toBeVisible();
            await shot(page, "current-attention-states.svg", "11-historical-inspection");

            await open(page, "Requirements document visual");
            const item = await itemFor(page, "Requirements document visual");
            const selectedPathname = "/api/work-items/" + encodeURIComponent(item.id);
            await page.route("**/api/work-items/**", async (route) => {
              const browserRequest = route.request();
              const url = new URL(browserRequest.url());
              if (url.pathname === selectedPathname && browserRequest.method() === "GET") {
                await route.fulfill({
                  status: 503,
                  contentType: "application/json",
                  body: JSON.stringify({
                    code: "VISUAL_FIXTURE_REFRESH_BLOCKED",
                    message: "Keep the conflict observation visible for the reference capture.",
                    sourceDiagnostic: null,
                    staleAuthorityOwner: null,
                  }),
                });
                return;
              }
              if (url.pathname === selectedPathname + "/runs" && browserRequest.method() === "POST") {
                await route.fulfill({
                  status: 409,
                  contentType: "application/json",
                  body: JSON.stringify({
                    code: "CURRENT_STATE_CONFLICT",
                    message: "The workflow changed before this command could commit.",
                    sourceDiagnostic: null,
                    staleAuthorityOwner: null,
                  }),
                });
                return;
              }
              await route.fallback();
            });
            await page.getByRole("button", { name: "Start Requirements", exact: true }).click();
            await expect(page.getByTestId("workflow-step-summary")).toContainText("Workflow state changed during the action");
            await shot(page, "current-attention-states.svg", "01-mutation-conflict");
            await page.unroute("**/api/work-items/**");
          });

          test("dialogue states", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            const processingItem = await itemFor(page, "Research processing dialogue visual");
            await fixture(page.context().request, "/start-stage", { workItemId: processingItem.id });
            await open(page, "Research processing dialogue visual");
            await expect(page.getByTestId("selected-run-header")).toContainText("Processing");
            await expect(page.getByTestId("activity-composer")).toHaveCount(0);
            await shot(page, "dialogue-states.svg", "processing");

            await open(page, "Research open continuation");
            await expect(page.getByText("The current Research findings are ready for your continuation.", { exact: true })).toBeVisible();
            const openComposer = page.getByTestId("activity-composer");
            await expect(openComposer).toBeVisible();
            await expect(openComposer.getByLabel("Message input")).toBeVisible();
            await expect(openComposer).toContainText("Continue current work");
            await shot(page, "dialogue-states.svg", "open-for-continuation");
            await shot(page, "research.svg", "open-dialogue");

            await open(page, "Workflow input required");
            const inputComposer = page.getByTestId("activity-composer");
            await expect(inputComposer).toBeVisible();
            await expect(inputComposer.getByLabel("Message input")).toBeVisible();
            await expect(inputComposer).toContainText("Answer the question above");
            await shot(page, "dialogue-states.svg", "waiting-for-you");

            await open(page, "Requirements document visual");
            await step(page, "Research");
            await disclosure(page, "Supporting material and history", "Open attempt 1");
            await expect(page.getByText("Completed", { exact: true }).first()).toBeVisible();
            await expect(page.getByTestId("activity-composer")).toHaveCount(0);
            await shot(page, "dialogue-states.svg", "closed");
          });

          test("proposal states", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            await open(page, "Proposal review");
            await expect(page.getByText("Pending review", { exact: true })).toBeVisible();
            await shot(page, "proposal-states.svg", "pending-review");
            await shot(page, "proposal-review.svg", "pending-review");

            await open(page, "Proposal adoption in progress");
            await expect(page.getByText("Adoption in progress", { exact: true }).first()).toBeVisible();
            await shot(page, "proposal-states.svg", "applying-change");

            await open(page, "Proposal review");
            await disclosure(page, "Supporting material and history", "Open attempt 1");
            await page.getByRole("button", { name: "Review proposed document change", exact: true }).click();
            await expect(page.getByText("Adopted", { exact: true })).toBeVisible();
            await shot(page, "proposal-states.svg", "adopted");

            await open(page, "Proposal rejection review");
            await page.getByRole("button", { name: "Reject", exact: true }).click();
            await expect(page.getByTestId("stage-run-material")).toBeVisible();
            await page.getByRole("button", { name: "Review proposed document change", exact: true }).click();
            await expect(page.getByText("Rejected", { exact: true })).toBeVisible();
            await shot(page, "proposal-states.svg", "rejected");
          });

          test("documents and authoring states", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            await open(page, "Implementation plan document visual");
            await selectCurrentDocument(page, "Implementation plan document");
            await expect(page.getByTestId("markdown-document-view")).toBeVisible({ timeout: 30000 });
            await shot(page, "implementation-plan.svg", "current-document");
            const planEditor = await edit(page, "Implementation plan document Markdown source");
            await expect(page.getByRole("radio", { name: "Split" })).toBeChecked();
            await shot(page, "document-authoring.svg", "split-authoring");
            await planEditor.click();
            await planEditor.press("Control+End");
            await page.keyboard.insertText("\nvisual dirty state");
            await expect(page.getByText("Unsaved", { exact: true })).toBeVisible();
            await shot(page, "document-states.svg", "dirty");
            await page.getByRole("button", { name: "Cancel", exact: true }).click();

            const activeItem = await itemFor(page, "Implementation plan document visual");
            await fixture(page.context().request, "/start-stage", { workItemId: activeItem.id });
            await page.reload();
            await expect(page.getByTestId("selected-run-header")).toContainText("Processing");
            await selectCurrentDocument(page, "Implementation plan document");
            await expect(page.getByTestId("markdown-document-readonly")).toBeVisible({ timeout: 30000 });
            await expect(page.getByRole("button", { name: "Edit", exact: true })).toHaveCount(0);
            await shot(page, "document-states.svg", "active-agent-read-only");

            await open(page, "Completed investigation");
            await step(page, "Research");
            await expect(page.getByTestId("markdown-readonly")).toBeVisible();
            await shot(page, "document-states.svg", "read-only");
            await shot(page, "document-readonly.svg", "research-readonly");

            await open(page, "Source editing workbench");
            await step(page, "Work request");
            const sourceEditor = await edit(page, "WorkItem source Markdown source");
            const sourceResponse = await page.context().request.get(
              "/api/work-items/" + (await itemFor(page, "Source editing workbench")).id + "/source",
            );
            expect(sourceResponse.status()).toBe(200);
            const source = await sourceResponse.json() as { path: string };
            const sourcePath = join(repositoryRoot, source.path);
            const original = readFileSync(sourcePath, "utf8");
            await sourceEditor.click();
            await sourceEditor.press("Control+End");
            await page.keyboard.insertText("\nlocal visual conflict buffer");
            writeFileSync(sourcePath, original + "\nexternal visual conflict\n");
            await page.getByRole("button", { name: "Save", exact: true }).click();
            await expect(page.getByText("Canonical document changed", { exact: true })).toBeVisible();
            await shot(page, "document-states.svg", "canonical-document-changed");
          });

          test("C4 primary workflow surfaces", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);

            await open(page, "Change work type");
            await expect(page.getByTestId("source-document-material")).toContainText("Requested outcome");
            await shot(page, "work-request.svg", "change-work-request");
            await shot(page, "work-type-variants.svg", "change");

            await open(page, "Defect work type");
            await expect(page.getByTestId("source-document-material")).toContainText("Observed behavior");
            await shot(page, "work-type-variants.svg", "defect");

            await open(page, "Investigation work type");
            await expect(page.getByTestId("source-document-material")).toContainText("Investigation boundary");
            await shot(page, "work-type-variants.svg", "investigation");

            await open(page, "Audit work type");
            await expect(page.getByTestId("source-document-material")).toContainText("Requested evidence/verdict");
            await shot(page, "work-type-variants.svg", "audit");

            await open(page, "Requirements document visual");
            await selectCurrentDocument(page, "Requirements document");
            await shot(page, "requirements.svg", "current");

            await open(page, "Solution design document visual");
            await selectCurrentDocument(page, "Solution design document");
            await shot(page, "solution-design.svg", "current");

            await open(page, "Implementation plan document visual");
            await selectCurrentDocument(page, "Implementation plan document");
            await shot(page, "implementation-plan.svg", "wide");
            await page.setViewportSize({ width: 1000, height: 800 });
            await shot(page, "implementation-plan.svg", "medium");
            await page.setViewportSize({ width: 700, height: 800 });
            await shot(page, "implementation-plan.svg", "narrow");

            await page.setViewportSize({ width: 1600, height: 900 });
            await open(page, "Readiness review document visual");
            await selectReadinessReview(page);
            await expect(page.getByRole("button", { name: "Sign off exact package" })).toHaveCount(0);
            await shot(page, "readiness-review.svg", "verdict-first");

            await open(page, "Readiness input required");
            await expect(page.locator(".order-readiness-current-interaction")).toBeVisible();
            await shot(page, "readiness-review.svg", "required-input");
          });

          test("Evidence surface", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await auth(page, request);
            await open(page, "Invalid lifecycle Markdown");
            await step(page, "Research");
            await page.getByRole("button", { name: "Inspect exact bytes", exact: true }).click();
            await expect(page.getByTestId("evidence-workspace")).toBeVisible();
            await shot(page, "evidence-viewer.svg", "exact-bytes");
          });

          test("exact safety confirmations", async ({ page, request }) => {
            await page.setViewportSize({ width: 1600, height: 900 });
            await page.route("**/api/opencode/accounts**", async (route) => {
              const browserRequest = route.request();
              const url = new URL(browserRequest.url());
              if (url.pathname === "/api/opencode/accounts" && browserRequest.method() === "GET") {
                await route.fulfill({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({
                    accounts: [{
                      id: "cred_visual",
                      label: "visual@example.com",
                      active: true,
                      status: { status: "READY" },
                    }],
                    activeAccountId: "cred_visual",
                    mutationBlockers: [],
                  }),
                });
                return;
              }
              await route.fallback();
            });
            await auth(page, request);

            await open(page, "Implementation plan safety visual");
            const editor = await edit(page, "Implementation plan document Markdown source");
            await editor.click();
            await editor.press("Control+End");
            await page.keyboard.insertText("\ndirty confirmation");
            await page.getByTestId("workflow-rail").getByRole("button", { name: "Approval", exact: true }).click();
            let dialog = page.getByRole("alertdialog", { name: "Discard unsaved Markdown?" });
            await expect(dialog).toContainText("Changing workflow step or material would discard the current unsaved Markdown buffer.");
            await shot(page, "safety-confirmations.svg", "dirty-material");
            await dialog.getByRole("button", { name: "Cancel", exact: true }).click();

            await page.getByRole("link", { name: "Back to queue" }).click();
            dialog = page.getByRole("alertdialog", { name: "Discard unsaved Markdown?" });
            await expect(dialog).toContainText("Leaving this WorkItem would discard the current unsaved Markdown buffer.");
            await shot(page, "safety-confirmations.svg", "dirty-destination");
            await dialog.getByRole("button", { name: "Discard unsaved changes", exact: true }).click();

            await open(page, "Implementation plan safety visual");
            await page.getByRole("button", { name: "Archive", exact: true }).click();
            dialog = page.getByRole("alertdialog", { name: "Archive work item?" });
            await expect(dialog).toContainText("Archive this WorkItem from the active queue. Its source, lifecycle documents, Runs, evidence, approvals and history remain intact.");
            await shot(page, "safety-confirmations.svg", "archive");
            await dialog.getByRole("button", { name: "Cancel", exact: true }).click();

            await open(page, "Change work type");
            const sourceEditor = await edit(page, "WorkItem source Markdown source");
            await sourceEditor.click();
            await sourceEditor.press("Control+End");
            await page.keyboard.insertText("\nGit confirmation material");
            await page.getByRole("button", { name: "Save", exact: true }).click();
            await expect(page.getByRole("button", { name: "Save documentation to Git" })).toBeVisible();
            await page.getByRole("button", { name: "Save documentation to Git" }).click();
            dialog = page.getByRole("alertdialog", { name: "Save WorkItem documentation to Git?" });
            await expect(dialog).toContainText("Only the exact governed paths reviewed in WorkItemDocumentationGitStatus will be committed.");
            await shot(page, "safety-confirmations.svg", "documentation-git");
            await dialog.getByRole("button", { name: "Cancel", exact: true }).click();

            await page.getByRole("link", { name: "Settings", exact: true }).click();
            await expect(page.getByTestId("settings-repositories")).toBeVisible();
            const repositoryRow = page.getByRole("table", { name: "Connected repositories" })
              .getByRole("row").filter({ hasText: repositoryRoot });
            await repositoryRow.getByRole("button", { name: /^Disconnect /u }).click();
            dialog = page.getByRole("alertdialog", { name: "Disconnect repository?" });
            await expect(dialog).toContainText("Remove only Order's connection. Repository files, WorkItem Markdown, Git history and authority documents are not deleted.");
            await shot(page, "safety-confirmations.svg", "disconnect-repository");
            await dialog.getByRole("button", { name: "Cancel", exact: true }).click();

            await page.getByRole("link", { name: "OpenCode", exact: true }).click();
            await expect(page.getByTestId("settings-opencode")).toBeVisible();
            const removeAccount = page.getByRole("button", { name: "Remove visual@example.com", exact: true });
            await expect(removeAccount).toBeVisible();
            await removeAccount.click();
            dialog = page.getByRole("alertdialog", { name: "Remove saved OpenCode account?" });
            await expect(dialog).toContainText("Remove the selected saved OpenCode credential from this installation.");
            await shot(page, "safety-confirmations.svg", "remove-opencode-account");
          });
          VISUAL

          cat > playwright.p3-p4-visual.temp.config.ts <<'CONFIG'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "p3-p4-visual.temp.spec.ts",
            workers: 1,
            retries: 0,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120000,
            },
          });
          CONFIG

      - name: Capture settled runtime states
        run: node node_modules/@playwright/test/cli.js test --config=playwright.p3-p4-visual.temp.config.ts

      - name: Rasterize assigned SVG references
        shell: bash
        run: |
          cat > p3-p4-reference-render.temp.mjs <<'SCRIPT'
          import { chromium } from "@playwright/test";
          import { mkdirSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";
          const refs = [
            "workitem-shell-controls.svg","current-attention-states.svg","dialogue-states.svg",
            "document-states.svg","proposal-states.svg","responsive-composition.svg",
            "theme-parity.svg","safety-confirmations.svg","work-request.svg","research.svg",
            "requirements.svg","solution-design.svg","implementation-plan.svg","readiness-review.svg",
            "document-authoring.svg","document-readonly.svg","proposal-review.svg",
            "evidence-viewer.svg","work-type-variants.svg"
          ];
          const out = resolve("c3-c4-evidence/reference");
          mkdirSync(out, { recursive: true });
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          for (const ref of refs) {
            await page.setContent(readFileSync(resolve("docs/references/workbench-ui", ref), "utf8"));
            await page.screenshot({ path: resolve(out, ref.replace(/\.svg$/u, ".png")), fullPage: false });
          }
          await browser.close();
          SCRIPT
          node p3-p4-reference-render.temp.mjs

      - name: Verify evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find c3-c4-evidence/reference -type f -name '*.png' | wc -l)" -eq 19
          test -s c3-c4-evidence/actual/dialogue-states/open-for-continuation.png
          test -s c3-c4-evidence/actual/current-attention-states/01-mutation-conflict.png
          test -s c3-c4-evidence/actual/current-attention-states/11-historical-inspection.png
          test -s c3-c4-evidence/actual/work-type-variants/audit.png
          test -s c3-c4-evidence/actual/safety-confirmations/remove-opencode-account.png

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-p4-visual-evidence-${{ github.sha }}
          path: c3-c4-evidence
          if-no-files-found: warn
          retention-days: 7
