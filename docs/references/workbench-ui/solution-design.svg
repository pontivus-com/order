 cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="720" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Implementation</text><text x="720" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">plan</text><circle cx="887" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="887" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Readiness</text><text x="887" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">review</text><circle cx="1054" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1054" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Approval</text><circle cx="1221" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1221" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Implementation</text><circle cx="1388" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1388" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Complete</text><line x1="0" y1="184" x2="1440" y2="184" stroke="#D9DEE8" stroke-width="1"/><rect x="28" y="200" width="1384" height="48" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="46" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="start">Current attention: Solution design</text><text x="380" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Define the technical solution that realizes the accepted Requirements.</text><rect x="28" y="266" width="280" height="42" rx="6" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Material: Solution design (current)</text><text x="286" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#657187" text-anchor="end">⌄</text><rect x="28" y="322" width="1384" height="500" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="52" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Solution design — OW-4827</text><rect x="1288" y="336" width="82" height="32" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1329" y="357" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Edit</text><text x="52" y="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">1. Design goals</text><text x="70" y="422" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Prevent cancellation while a proposal is pending.</text><text x="70" y="441" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Preserve existing proposal adoption and restart behavior.</text><text x="70" y="460" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Return a clear, actionable product failure when cancellation is blocked.</text><text x="52" y="490" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">2. Correct control owner</text><text x="70" y="512" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Apply the guard at the canonical cancellation admission boundary, not as a UI-only rule.</text><text x="52" y="542" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">3. Interaction / control flow</text><text x="70" y="564" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Pending proposal → cancellation unavailable → reject proposal → cancellation becomes eligible.</text><text x="70" y="583" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Adoption in progress → complete or reconcile adoption; do not cancel it.</text><text x="52" y="613" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">4. Validation obligations</text><text x="70" y="635" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Prove blocked cancellation, post-reject cancellation, and unchanged adoption/restart behavior.</text><rect x="1020" y="390" width="350" height="152" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="1040" y="420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Requirement coverage</text><text x="1040" y="448" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Block pending cancellation</text><text x="1040" y="472" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Require explicit rejection</text><text x="1040" y="496" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Preserve adoption behavior</text><text x="1040" y="520" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">✓ Clear user feedback</text><rect x="1020" y="566" width="350" height="130" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="1040" y="596" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Defect context</text><text x="1040" y="624" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Root cause: cancellation admission ignores</text><text x="1040" y="643" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">the unresolved proposal ownership condition.</text><text x="1040" y="662" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Preserved: adoption/restart semantics.</text><rect x="28" y="842" width="1384" height="36" rx="5" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="865" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Technical details  ›</text></svg>