<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Complete — Audit/Investigation remediation branch</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference composition</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start">Terminal-result follow-up is available only for canonically eligible outcomes.</text><rect x="28" y="132" width="1384" height="164" rx="8" fill="#F0FDF4" stroke="#D9DEE8"/><rect x="50" y="154" width="160" height="24" rx="12" fill="#F0FDF4" stroke="#F0FDF4"/><text x="130" y="171" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#16A34A" text-anchor="middle">AUDIT_COMPLETE</text><text x="234" y="173" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Source-backed parent Audit result</text><text x="50" y="210" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Audit Order 0.5.0 workflow, Workbench, and OpenCode execution correctness</text><text x="50" y="232" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">The completed result remains terminal; remediation is a separate governed WorkItem.</text><rect x="28" y="322" width="1384" height="238" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="50" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Permitted follow-up</text><text x="50" y="390" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Create linked remediation does not mutate or reopen the completed Audit.</text><text x="50" y="412" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">The new WorkItem must be Change or Defect, same project, and carries immutable derivedFromWorkItemId.</text><rect x="50" y="474" width="226" height="38" rx="6" fill="#1E3A8A" stroke="#1E3A8A"/><text x="163" y="499" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Create linked remediation</text><rect x="28" y="590" width="1384" height="152" rx="8" fill="#F8FAFC" stroke="#D9DEE8"/><text x="50" y="624" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Non-eligible terminal outcomes</text><text x="50" y="654" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="500" fill="#657187" text-anchor="start">Complete does not show this action for ordinary delivery completion or other terminal classifications.</text></svg>