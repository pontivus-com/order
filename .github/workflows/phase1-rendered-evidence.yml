name: Phase 1 rendered evidence

on:
  push:
    branches:
      - version/0.5.0
    paths:
      - .github/workflows/phase1-rendered-evidence.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
      PHASE1_AUDIT_SHA: 54e0a204bf35be1ee7d6118e798531015475baa0
    steps:
      - name: Checkout exact audited branch parent
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin "+refs/heads/version/0.5.0:refs/remotes/origin/version-0.5.0"
          git checkout --detach "${PHASE1_AUDIT_SHA}"
          test "$(git rev-parse HEAD)" = "${PHASE1_AUDIT_SHA}"

      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz"             "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"

          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.13.0"
          test "$(bun --version)" = "1.4.4"
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          test "$(/tmp/pontivus-order-opencode/bin/opencode --version)" = "opencode v2.2.6"
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Prepare deterministic OpenCode UI fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/phase1-fake-opencode"
          mkdir -p "${fixture_dir}"
          bun - <<'BUN'
          import { chmodSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const source = readFileSync("tests/opencode.test.ts", "utf8");
          const marker = "const fakeOpenCodeSource = ";
          const start = source.indexOf(marker);
          if (start < 0) throw new Error("fakeOpenCodeSource marker missing");
          const literalStart = start + marker.length;
          const endMarker = "\n`;\n\nconst createFakeOpenCode";
          const end = source.indexOf(endMarker, literalStart);
          if (end < 0) throw new Error("fakeOpenCodeSource end marker missing");
          const literal = source.slice(literalStart, end + 2);
          const fakeSource = (0, eval)(literal);
          const dir = process.env.RUNNER_TEMP + "/phase1-fake-opencode";
          const binary = join(dir, "fake-opencode.ts");
          writeFileSync(binary, fakeSource, { mode: 0o755 });
          chmodSync(binary, 0o755);
          writeFileSync(join(dir, ".fake-opencode.json"), JSON.stringify({
            accountConnections: [
              { type: "credential", id: "cred_beta", label: "beta@example.com", method: "oauth", status: { status: "needs_auth", message: "Reconnect account", url: "https://opencode.ai/console/reconnect" } },
              {
                type: "credential",
                id: "cred_alpha",
                label: "alpha@example.com",
                method: "oauth",
                status: {
                  status: "needs_auth",
                  message: "Reconnect account",
                  url: "https://opencode.ai/console/reconnect"
                }
              },
              { type: "credential", id: "cred_gamma", label: "gamma@example.com", method: "oauth" }
            ],
            authorizationUrl: "https://opencode.ai/console/device",
            oauthStatus: "pending"
          }));
          BUN
          echo "PONTIVUS_ORDER_OPENCODE_BIN=${fixture_dir}/fake-opencode.ts" >> "${GITHUB_ENV}"

      - name: Generate temporary capture spec
        shell: bash
        run: |
          set -euo pipefail
          cat > phase1-playwright.config.ts <<'CONFIG'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./tests",
            testMatch: "phase1-capture.spec.ts",
            workers: 1,
            retries: 0,
            use: { baseURL: "http://127.0.0.1:17347" },
            projects: [{ name: "chromium", use: { browserName: "chromium" } }],
            webServer: {
              command: "bun tests/e2e-server.ts",
              url: "http://127.0.0.1:17347/api/health",
              reuseExistingServer: false,
              timeout: 120000,
            },
          });
          CONFIG

          cat > tests/phase1-capture.spec.ts <<'SPEC'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { expect, test, type APIRequestContext, type Locator, type Page } from "@playwright/test";

          const baseURL = "http://127.0.0.1:17347";
          const stateRoot = process.env.PONTIVUS_ORDER_TEST_STATE_ROOT;
          const auditSha = process.env.PHASE1_AUDIT_SHA ?? "unknown";
          if (!stateRoot) throw new TypeError("PONTIVUS_ORDER_TEST_STATE_ROOT is required");
          const daemonToken = readFileSync(join(stateRoot, "daemon-token"), "utf8").trim();
          const output = "phase1-rendered-evidence";
          mkdirSync(output, { recursive: true });
          const manifest: Array<Record<string, unknown>> = [];

          const mintConnectToken = async (request: APIRequestContext): Promise<string> => {
            const response = await request.post("/api/auth/connect-token", {
              headers: { authorization: "Bearer " + daemonToken },
              data: {},
            });
            expect(response.status()).toBe(200);
            const body = await response.json() as { token?: unknown };
            expect(typeof body.token).toBe("string");
            return String(body.token);
          };

          const authenticate = async (page: Page, request: APIRequestContext): Promise<void> => {
            const token = await mintConnectToken(request);
            await page.goto("/connect?token=" + token);
            await expect(page).toHaveURL(baseURL + "/");
            await expect(page.getByTestId("work-item-queue")).toBeVisible();
          };

          const closeAllFixtureRuns = async (page: Page): Promise<void> => {
            const itemsResponse = await page.context().request.get("/api/work-items?includeArchived=true");
            expect(itemsResponse.ok()).toBe(true);
            const items = await itemsResponse.json() as Array<{ id: string }>;
            for (const item of items) {
              const runsResponse = await page.context().request.get(
                "/api/work-items/" + encodeURIComponent(item.id) + "/runs",
              );
              if (!runsResponse.ok()) continue;
              const runs = await runsResponse.json() as Array<{ id: string; status: string }>;
              for (const run of runs) {
                if (run.status !== "RUNNING" && run.status !== "WAITING_FOR_INPUT") continue;
                const cancelled = await page.context().request.post(
                  "/api/runs/" + encodeURIComponent(run.id) + "/cancel",
                  { data: {} },
                );
                expect([200, 409]).toContain(cancelled.status());
              }
            }
          };

          const rowFor = (page: Page, title: string) =>
            page.locator('[data-testid^="work-item-row-"]').filter({
              has: page.getByText(title, { exact: true }),
            }).first();

          const openWorkItem = async (page: Page, title: string): Promise<void> => {
            await page.goto("/");
            const row = rowFor(page, title);
            await expect(row).toBeVisible();
            await row.click();
            await expect(page.getByTestId("work-item-workspace")).toBeVisible();
            await expect(page.getByTestId("work-item-heading")).toHaveText(title);
          };

          const selectStep = async (page: Page, name: string): Promise<void> => {
            const button = page.getByTestId("workflow-rail").getByRole("button", { name, exact: true });
            await button.click();
            await expect(button).toHaveAttribute("aria-pressed", "true");
          };

          const replaceMarkdownSource = async (
            page: Page,
            editor: Locator,
            markdown: string,
          ): Promise<void> => {
            await editor.click();
            await editor.press("Control+A");
            await page.keyboard.insertText(markdown);
            const finalLine = markdown.split("\n").at(-1) ?? "";
            await expect(editor.locator(".cm-line").last()).toHaveText(finalLine);
          };

          const capture = async (
            page: Page,
            surf: string,
            scenario: string,
            filename: string,
            evidenceClass: "production-runtime" | "deterministic-contract-fixture" = "production-runtime",
          ): Promise<void> => {
            await page.waitForTimeout(120);
            const viewport = page.viewportSize();
            await page.screenshot({ path: join(output, filename), fullPage: false });
            manifest.push({ surf, scenario, filename, auditSha, viewport, url: page.url(), evidenceClass });
            writeFileSync(
              join(output, "manifest.json"),
              JSON.stringify({ auditSha, capturedAt: new Date().toISOString(), entries: manifest }, null, 2) + "\n",
            );
          };

          test("capture remaining Phase 1 rendered states", async ({ page, request }) => {
            test.setTimeout(120000);
            await page.setViewportSize({ width: 1600, height: 900 });
            await authenticate(page, request);
            await closeAllFixtureRuns(page);

            await page.goto("/settings/opencode");
            await expect(page.getByTestId("settings-opencode")).toBeVisible();
            const addAccount = page.getByRole("button", { name: "Add account", exact: true });
            await expect(addAccount).toBeEnabled();

            await page.getByRole("button", { name: "Rename beta@example.com", exact: true }).click();
            await expect(page.getByTestId("rename-opencode-account")).toBeVisible();
            await capture(page, "SURF-SET-OC-RENAME-001", "rename saved OpenCode account", "35-settings-opencode-rename.png", "deterministic-contract-fixture");
            await page.getByRole("button", { name: "Cancel rename", exact: true }).click();

            await page.getByRole("button", { name: "Remove beta@example.com", exact: true }).click();
            await expect(page.getByRole("alertdialog", { name: "Remove saved OpenCode account?" })).toBeVisible();
            await capture(page, "SURF-CONF-OC-REMOVE-001", "remove saved OpenCode account confirmation", "36-settings-opencode-remove.png", "deterministic-contract-fixture");
            await page.keyboard.press("Escape");

            await addAccount.click();
            await capture(page, "SURF-SET-OC-ADD-001", "add OpenCode account form", "37-settings-opencode-add.png", "deterministic-contract-fixture");
            await page.getByLabel("Account label").fill("phase1@example.com");
            await page.getByRole("button", { name: "Continue to OpenCode sign-in", exact: true }).click();
            await expect(page.getByTestId("opencode-login-attempt")).toBeVisible();
            await expect(page.getByText("Waiting for OpenCode sign-in…", { exact: true })).toBeVisible();
            await capture(page, "SURF-SET-OC-LOGIN-001", "pending OpenCode device sign-in", "38-settings-opencode-login.png", "deterministic-contract-fixture");
            await page.getByRole("button", { name: "Cancel OpenCode sign-in", exact: true }).click();

            await openWorkItem(page, "Proposal review");
            await page.getByRole("button", { name: "Archive work item", exact: true }).click();
            await expect(page.getByRole("alertdialog", { name: "Archive work item?" })).toBeVisible();
            await capture(page, "SURF-CONF-ARCHIVE-001", "archive WorkItem confirmation", "39-archive-confirmation.png");
            await page.keyboard.press("Escape");

            await openWorkItem(page, "Lifecycle editing workbench");
            await selectStep(page, "Implementation plan");
            let editor = page.getByLabel("Implementation plan document Markdown source");
            await replaceMarkdownSource(page, editor, "# Phase 1 residual evidence\n\nUnsaved destination-change buffer");
            await page.getByRole("link", { name: "Settings", exact: true }).click();
            await expect(page.getByRole("alertdialog", { name: "Discard unsaved Markdown?" })).toBeVisible();
            await capture(page, "SURF-CONF-DIRTY-DEST-001", "dirty document blocks application destination change", "40-dirty-destination-confirmation.png");
            await page.getByRole("alertdialog", { name: "Discard unsaved Markdown?" })
              .getByRole("button", { name: "Continue editing" }).click();

            await selectStep(page, "Work request");
            editor = page.getByLabel("WorkItem source Markdown source");
            const current = await editor.evaluate((node) =>
              Array.from(node.querySelectorAll(".cm-line")).map((line) => line.textContent ?? "").join("\n")
            );
            await replaceMarkdownSource(page, editor, current + "\n\nPhase 1 Git evidence.");
            await page.getByRole("button", { name: "Save", exact: true }).click();
            await expect(page.getByRole("button", { name: "Save documentation to Git", exact: true })).toBeVisible();
            await page.getByRole("button", { name: "Save documentation to Git", exact: true }).click();
            await expect(page.getByRole("alertdialog", { name: "Save WorkItem documentation to Git?" })).toBeVisible();
            await capture(page, "SURF-CONF-DOC-GIT-001", "governed documentation Git commit confirmation", "41-document-git-confirmation.png");
            await page.keyboard.press("Escape");

            await openWorkItem(page, "Long source editing workbench wide");
            await selectStep(page, "Work request");
            await page.setViewportSize({ width: 1600, height: 900 });
            await capture(page, "SURF-MAT-SOURCE-001", "long Work request density wide", "42-long-source-wide.png");
            await page.setViewportSize({ width: 700, height: 800 });
            await capture(page, "SURF-MAT-SOURCE-001", "long Work request density narrow", "43-long-source-narrow.png");

            await page.setViewportSize({ width: 1600, height: 900 });
            await page.goto("/");
            await page.getByRole("radio", { name: "Light", exact: true }).click();
            await capture(page, "SURF-APP-001", "explicit light theme application shell", "44-theme-light.png");
            await page.getByRole("radio", { name: "Dark", exact: true }).click();
            await capture(page, "SURF-APP-001", "explicit dark theme application shell", "45-theme-dark.png");
          });
          SPEC
          SPEC

      - name: Capture rendered states
        run: node node_modules/@playwright/test/cli.js test --config=phase1-playwright.config.ts

      - name: Record evidence metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase1-rendered-evidence
          printf '%s\n' "${PHASE1_AUDIT_SHA}" > phase1-rendered-evidence/audit-sha.txt
          git status --short > phase1-rendered-evidence/runner-working-tree.txt

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-rendered-evidence
          path: phase1-rendered-evidence/
          if-no-files-found: error
          retention-days: 30
