7" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Readiness</text><text x="887" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">review</text><circle cx="1054" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1054" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Approval</text><circle cx="1221" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1221" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Implementation</text><circle cx="1388" cy="128" r="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1388" y="156" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">Complete</text><line x1="0" y1="184" x2="1440" y2="184" stroke="#D9DEE8" stroke-width="1"/><rect x="28" y="200" width="1384" height="48" rx="6" fill="#EFF6FF" stroke="#EFF6FF"/><text x="46" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="start">Current attention: Work request</text><text x="330" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">Define the originating defect report sufficiently to begin Research.</text><rect x="28" y="266" width="260" height="42" rx="6" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">Material: Work request</text><text x="266" y="292" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#657187" text-anchor="end">⌄</text><rect x="28" y="322" width="1384" height="500" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="52" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Work request — Defect intake</text><rect x="1230" y="336" width="116" height="28" rx="14" fill="#F8FAFC" stroke="#F8FAFC"/><text x="1288" y="355" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Draft</text><text x="52" y="402" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Observed behavior</text><text x="70" y="424" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Cancellation is available while a lifecycle proposal remains pending.</text><text x="70" y="444" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Cancelling can leave that proposal unresolved after its owning attempt closes.</text><text x="52" y="476" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Expected behavior</text><text x="70" y="498" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Cancellation is unavailable while a proposal remains pending.</text><text x="70" y="518" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• The operator is told to reject or otherwise resolve the proposal first.</text><text x="52" y="550" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Reproduction / evidence</text><text x="70" y="572" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Create or adopt a proposal, keep it pending, then attempt cancellation.</text><text x="70" y="592" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Attach known evidence if available; unknown details may remain incomplete at intake.</text><text x="52" y="624" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Must remain unchanged</text><text x="70" y="646" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Existing proposal adoption and rejection behavior.</text><text x="70" y="666" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Durable proposal intent and restart behavior.</text><text x="52" y="698" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Impact / context</text><text x="70" y="720" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">• Pending proposals can become orphaned and require manual cleanup.</text><rect x="1040" y="350" width="330" height="172" rx="8" fill="#F0FDF4" stroke="#D9DEE8"/><text x="1062" y="382" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#16A34A" text-anchor="start">Ready to start Research</text><text x="1062" y="408" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">The request contains enough</text><text x="1062" y="428" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">classified intent to begin factual</text><text x="1062" y="448" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">investigation.</text><rect x="1084" y="470" width="244" height="38" rx="6" fill="#1E3A8A" stroke="#1E3A8A"/><text x="1206" y="495" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start Research</text><rect x="28" y="842" width="1384" height="36" rx="5" fill="#F8FAFC" stroke="#D9DEE8"/><text x="44" y="865" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Technical details  ›</text></svg>