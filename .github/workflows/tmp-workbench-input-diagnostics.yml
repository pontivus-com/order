name: Temporary Workbench Input Diagnostics

on:
  push:
    branches:
      - feat/workbench-v2-implementation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      PONTIVUS_ORDER_TEST_STATE_ROOT: /tmp/pontivus-order-browser-state
      PONTIVUS_ORDER_OPENCODE_BIN: /tmp/pontivus-order-opencode/bin/opencode
    steps:
      - name: Checkout exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=50 origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/diagnostic"
          git checkout --detach refs/remotes/origin/diagnostic
      - name: Install exact Node and Bun
        shell: bash
        run: |
          set -euo pipefail
          node_root="${RUNNER_TEMP}/node"
          mkdir -p "${node_root}"
          curl -fsSLo "${RUNNER_TEMP}/node.tar.xz" "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node.tar.xz" -C "${node_root}" --strip-components=1
          echo "${node_root}/bin" >> "${GITHUB_PATH}"
          curl -fsSLo "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"
      - name: Install exact OpenCode and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pontivus-order-opencode
          BUN_INSTALL=/tmp/pontivus-order-opencode bun install -g --trust @opencode/cli@2.2.6
          bun ci
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run input reconciliation diagnostic
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/browser.spec.ts")
          text = path.read_text()
          needle = '  await page.unroute(inputPattern);\n  await expect(\n    page.locator(\'[data-event-tag="HUMAN_INPUT_RECEIVED"]\'),'
          replacement = '''  await page.unroute(inputPattern);
  console.log("=== INPUT WORKSPACE DOM ===");
  console.log(await page.evaluate(() => document.body.innerText));
  console.log("=== INPUT EVENTS API ===");
  console.log(await (await page.context().request.get(
    "/api/runs/" + inputRun!.id + "/events?afterSequence=0",
  )).text());
  await expect(
    page.locator('[data-event-tag="HUMAN_INPUT_RECEIVED"]'),'''
          if needle not in text:
              raise SystemExit("diagnostic injection anchor missing")
          path.write_text(text.replace(needle, replacement, 1))
          PY
          node node_modules/@playwright/test/cli.js test tests/browser.spec.ts --grep "successful workflow mutations reconcile"
          status=$?
          echo "=== PLAYWRIGHT ERROR CONTEXTS ==="
          find test-results -type f -name error-context.md -print -exec cat {} \; || true
          exit "$status"
