authority = ["docs/architecture/workbench.md", "docs/architecture/technical-architecture.md", "docs/contracts/canonical-contracts.md", "docs/references/external-facts.md", "docs/governance/repository-delivery.md", "docs/requirements/work-item-documents.md", "docs/requirements/installation-readiness.md"]
paths = [".bun-version", ".node-version", ".gitignore", ".github/**", "CHANGELOG.md", "CONTRIBUTING.md", "package.json", "bun.lock", "scripts/**", "tsconfig.json", "vite.config.ts", "vitest.config.ts", "playwright.config.ts", "pontivus-order.toml.example", "install.sh", "src/installer.ts", "src/version.ts", "README.md"]
gates = ["dependency-lock", "typecheck", "architecture", "test", "build"]

[concerns.core]
authority = ["docs/requirements/work-lifecycle.md", "docs/requirements/workbench.md", "docs/requirements/specification-standard.md", "docs/requirements/validation-standard.md", "docs/governance/minimum-change.md", "docs/requirements/project-governance-integration.md", "docs/governance/systems-governance.md", "docs/requirements/lifecycle-context.md", "docs/architecture/technical-architecture.md", "docs/architecture/workbench.md", "docs/contracts/canonical-contracts.md", "docs/requirements/work-item-documents.md", "docs/requirements/markdown-workbench.md"]
paths = ["src/core/**"]
gates = ["typecheck", "architecture", "test"]

[concerns.shell]
authority = ["docs/architecture/execution-control-plane.md", "docs/requirements/validation-standard.md", "docs/architecture/opencode-integration.md", "docs/requirements/project-governance-integration.md", "docs/architecture/technical-architecture.md", "docs/contracts/canonical-contracts.md", "docs/references/external-facts.md", "docs/requirements/work-item-documents.md", "docs/requirements/markdown-workbench.md", "docs/requirements/installation-readiness.md"]
paths = ["src/shell/**"]
gates = ["typecheck", "architecture", "test"]

[concerns.daemon]
authority = ["docs/product/system-brief.md", "docs/requirements/work-lifecycle.md", "docs/requirements/workbench.md", "docs/architecture/execution-control-plane.md", "docs/requirements/validation-standard.md", "docs/architecture/opencode-integration.md", "docs/architecture/technical-architecture.md", "docs/architecture/workbench.md", "docs/contracts/canonical-contracts.md", "docs/references/external-facts.md", "docs/requirements/work-item-documents.md", "docs/requirements/markdown-workbench.md", "docs/requirements/installation-readiness.md"]
paths = ["src/daemon/**", "src/cli.ts"]
gates = ["typecheck", "architecture", "test"]

[concerns.ui]
authority = ["docs/requirements/workbench.md", "docs/architecture/workbench.md", "docs/architecture/workbench-theme.md", "docs/product/system-brief.md", "docs/product/product-identity.md", "docs/requirements/work-lifecycle.md", "docs/requirements/specification-standard.md", "docs/architecture/technical-architecture.md", "docs/contracts/canonical-contracts.md", "docs/references/external-facts.md", "docs/requirements/work-item-documents.md", "docs/requirements/markdown-workbench.md", "docs/requirements/installation-readiness.md"]
paths = ["index.html", "ui/**"]
gates = ["typecheck", "architecture", "test", "build", "browser"]

[concerns.verification]
authority = ["docs/requirements/workbench.md", "docs/architecture/workbench.md", "docs/architecture/workbench-theme.md", "docs/requirements/specification-standard.md", "docs/requirements/validation-standard.md", "docs/architecture/opencode-integration.md", "docs/governance/minimum-change.md", "docs/architecture/technical-architecture.md", "docs/contracts/canonical-contracts.md", "docs/references/external-facts.md", "docs/governance/repository-delivery.md", "docs/requirements/work-item-documents.md", "docs/requirements/markdown-workbench.md", "docs/requirements/installation-readiness.md"]
paths = ["tests/**", "playwright.config.ts"]
gates = ["dependency-lock", "typecheck", "architecture", "test", "build", "browser"]

[verification.dependency-lock]
argv = ["bun", "ci"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = []

[verification.typecheck]
argv = ["bun", "run", "tsc", "--noEmit"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = []

[verification.architecture]
argv = ["node", "node_modules/vitest/vitest.mjs", "run", "tests/architecture.test.ts"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = ["tests/architecture.test.ts"]

[verification.test]
argv = ["node", "node_modules/vitest/vitest.mjs", "run"]
cwd = "."
timeoutSeconds = 1800
inheritEnv = ["PATH", "HOME", "TMPDIR", "PONTIVUS_ORDER_TEST_STATE_ROOT", "PONTIVUS_ORDER_OPENCODE_BIN", "PONTIVUS_ORDER_OPENCODE_MODEL"]
materialRefs = []

[verification.build]
argv = ["node", "node_modules/vite/bin/vite.js", "build"]
cwd = "."
timeoutSeconds = 600
inheritEnv = ["PATH", "HOME", "TMPDIR"]
materialRefs = []

[verification.browser]
argv = ["node", "node_modules/@playwright/test/cli.js", "test"]
cwd = "."
timeoutSeconds = 1800
inheritEnv = ["PATH", "HOME", "TMPDIR", "PONTIVUS_ORDER_TEST_STATE_ROOT", "PONTIVUS_ORDER_OPENCODE_BIN", "PONTIVUS_ORDER_OPENCODE_MODEL"]
materialRefs = []
