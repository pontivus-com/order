<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><rect width="1440" height="54" fill="#111F38"/><text x="26" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Order</text><text x="100" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#D7E2F1" text-anchor="start">Document mutation states</text><text x="1390" y="35" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#D7E2F1" text-anchor="end">Reference state sheet</text><text x="28" y="94" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">Conflict-safe Markdown authoring</text><rect x="28" y="132" width="1384" height="190" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="154" width="120" height="24" rx="12" fill="#FFFAEB" stroke="#FFFAEB"/><text x="110" y="171" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#B54708" text-anchor="middle">Dirty</text><text x="190" y="172" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Unsaved local buffer</text><text x="50" y="204" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Save uses the exact current document identity. Navigation/material change opens the exact discard confirmation.</text><text x="50" y="226" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Active agent work disables canonical document/title Save.</text><rect x="28" y="344" width="1384" height="212" rx="8" fill="#FEF3F2" stroke="#D9DEE8"/><rect x="50" y="366" width="180" height="24" rx="12" fill="#FEF3F2" stroke="#FEF3F2"/><text x="140" y="383" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#B42318" text-anchor="middle">Canonical document changed</text><text x="50" y="410" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">The canonical file changed while this buffer was open.</text><text x="50" y="434" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">The local buffer is not rebased or overwritten.</text><text x="50" y="458" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Primary recovery action: Reload current.</text><rect x="50" y="492" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#FFFFFF"/><text x="120" y="509" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">Reload current</text><rect x="28" y="578" width="1384" height="176" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="50" y="600" width="120" height="24" rx="12" fill="#F8FAFC" stroke="#F8FAFC"/><text x="110" y="617" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="700" fill="#657187" text-anchor="middle">Read-only</text><text x="50" y="644" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Historical/supporting/Readiness/Approval material has no Save control.</text><text x="50" y="666" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">In Implementation/Complete, Work request/lifecycle documents remain inspectable but are not directly editable.</text></svg>