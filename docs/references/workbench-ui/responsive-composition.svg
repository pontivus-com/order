ans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">one primary material at a time</text><text x="62" y="586" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="500" fill="#657187" text-anchor="start">task controls stay attached to material</text><text x="520" y="430" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Implementation on medium/narrow</text><rect x="520" y="448" width="892" height="340" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><rect x="538" y="466" width="258" height="302" rx="6" fill="#F8FAFC" stroke="#D9DEE8"/><text x="554" y="496" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">temporary master Drawer</text><text x="554" y="526" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">inline-start edge</text><text x="554" y="548" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">no scrim</text><text x="554" y="570" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">visible close</text><text x="554" y="592" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">focus returns</text><rect x="812" y="466" width="582" height="302" rx="6" fill="#FFFFFF" stroke="#D9DEE8"/><text x="830" y="496" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">task detail remains primary canvas</text></svg>