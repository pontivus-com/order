<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#FFFFFF"/><rect width="1440" height="52" fill="#111F38"/><text x="28" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start">Order Workbench — work-type variants</text><text x="38" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="start">The shell and interaction classes stay stable; the selected work type changes the information contract.</text><rect x="38" y="130" width="330" height="610" rx="8" fill="#FFFFFF" stroke="#D9DEE8"/><text x="58" y="166" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start">Change</text><rect x="258" y="146" width="84" height="28" rx="14" fill="#EFF6FF" stroke="#EFF6FF"/><text x="300" y="165" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Change</text><text x="58" y="210" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Work request</text><text x="58" y="238" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Work request: requested outcome, context, constraints, references</text><line x1="58" y1="290" x2="348" y2="290" stroke="#D9DEE8" stroke-width="1"/><text x="58" y="326" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Research</text><text x="58" y="354" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start